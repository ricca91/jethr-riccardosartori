<style>

  --focus:#37c493; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0c1116; --surface:#141b22; --surface-2:#1a222b; --ink:#e9eef4; --ink-2:#a9b6c4; --ink-3:#7b8896;
  --line:#27313c; --line-2:#1e2731;
  --netto:#37c493; --netto-soft:#0f2e25; --contrib:#8ba3ff; --contrib-soft:#1a2244;

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);

/* --- prototype chrome (deliberately NOT part of the design under evaluation) --- */
.protobar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:90;display:flex;
  align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 20px);
  background:#10151c;color:#f2f5f8;border-radius:999px;padding:6px 8px;box-shadow:0 8px 30px rgba(0,0,0,.35);
  font-size:13px;border:1px solid #2b333d}
.protobar button{background:#232c36;border:1px solid #333d49;color:#f2f5f8;border-radius:999px;
  padding:5px 10px;cursor:pointer;line-height:1.2}
.protobar button:hover{background:#2e3945}
.protobar button[aria-pressed="true"]{background:#f2f5f8;color:#10151c;border-color:#f2f5f8}
.protobar .vlabel{padding:0 8px;font-weight:600;white-space:nowrap}
.protobar .sep{width:1px;height:20px;background:#333d49;margin:0 2px}
.protobar select{background:#232c36;color:#f2f5f8;border:1px solid #333d49;border-radius:999px;padding:4px 6px;font:inherit}
.protonote{max-width:1060px;margin:0 auto 4px;padding:10px 16px;font-size:12.5px;color:var(--ink-3)}

/* --- shared UI --- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.01em;

.assunzioni span{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);

label.fld{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.ralbox{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--surface);padding:0 14px}
.ralbox:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
.ralbox .eur{font-size:22px;color:var(--ink-3)}
.ralbox input{border:0;outline:0;background:transparent;color:var(--ink);font-size:26px;font-weight:650;
  padding:12px 0;width:100%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{background:transparent;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hint{font-size:12.5px;color:var(--ink-3)}
.err{font-size:13px;color:var(--tax);font-weight:600;margin-top:8px}
:where(button,summary,input,a,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:22px;font-weight:680;letter-spacing:-.02em;margin-top:3px;white-space:nowrap}
.kpi.hero .v{font-size:26px}
.kpi.netto .v{color:var(--netto)}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

table.ledger{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.ledger td,table.ledger th{padding:9px 6px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
table.ledger th{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
td.op{width:20px;font-weight:700;color:var(--ink-3);text-align:center}
td.amt{text-align:right;white-space:nowrap;font-weight:600}
tr.total td{border-top:2px solid var(--ink);border-bottom:0;padding-top:12px;font-size:17px;font-weight:700}
tr.total td.amt{color:var(--netto);font-size:20px}
tr.sub td{color:var(--ink-2);font-size:13.5px}
.rowbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;
  display:inline-flex;align-items:center;gap:7px}
.rowbtn .chev{color:var(--ink-3);font-size:11px;transition:transform .12s}
.rowbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.explain{background:var(--surface-2);border-left:3px solid var(--line);padding:10px 12px;margin:2px 0 6px;
  border-radius:0 8px 8px 0;font-size:13.5px;color:var(--ink-2)}
.explain code{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 5px;
  font-size:12.5px;white-space:pre-wrap}
.explain .src{margin-top:6px;font-size:12.5px}
a{color:var(--netto);text-decoration-thickness:1px;text-underline-offset:2px}

.notice{border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--integr-soft);border:1px solid color-mix(in srgb,var(--integr) 35%,transparent);color:var(--ink)}
.notice.info{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.notice b{color:var(--ink)}
.notice .ico{font-size:15px;line-height:1.3}

details.acc{border-bottom:1px solid var(--line-2)}
details.acc>summary{cursor:pointer;padding:12px 2px;font-weight:600;list-style:none;display:flex;
  justify-content:space-between;align-items:center;gap:10px}
details.acc>summary>span{flex:1}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";color:var(--ink-3);font-weight:400;font-size:18px}
details.acc[open]>summary::after{content:"–"}
details.acc .body{padding:0 2px 14px;font-size:13.5px;color:var(--ink-2)}
ul.tight{margin:6px 0 0;padding-left:18px}
ul.tight li{margin:3px 0}

.flowsvg{width:100%;height:auto;display:block;overflow:visible}
.flowsvg text{fill:var(--ink-2);font-family:inherit;font-size:inherit}
.flowsvg text.n{font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}
.flowsvg .band{cursor:pointer}
.flowsvg .band:hover rect,.flowsvg .band:focus rect{filter:brightness(1.06)}

.stackbar{display:flex;width:100%;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.stackbar div{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;
  overflow:hidden;white-space:nowrap}

.eegg{background:linear-gradient(135deg,var(--netto-soft),var(--contrib-soft));border:1px solid var(--line);
  border-radius:12px;padding:14px;font-size:13.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:880px){.cols.two{grid-template-columns:340px 1fr;align-items:start}
  .cols.two .sticky{position:sticky;top:16px}}
.stack{display:flex;flex-direction:column;gap:16px}
.pad{padding:16px}
.mt{margin-top:16px}
.dim{color:var(--ink-3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;
  font-weight:600;color:var(--ink-3);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--netto)}
.answer{text-align:center;padding:26px 16px 22px}
.answer .lbl{font-size:13px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.answer .big{font-size:clamp(44px,12vw,72px);font-weight:700;letter-spacing:-.035em;line-height:1.02;color:var(--netto)}
.answer .sub{color:var(--ink-2);margin-top:6px;font-size:14px}
.rowbtn{align-items:flex-start}
@media(max-width:560px){
  .wrap{padding:16px 12px 0}
  .pad{padding:13px}
  .protonote{padding:10px 12px}
  table.ledger td,table.ledger th{padding:8px 3px;font-size:14px}
  table.ledger{min-width:296px}
  tr.total td{font-size:16px}
  tr.total td.amt{font-size:18px}
  .kpi .v{font-size:19px}
  .kpi.hero .v{font-size:23px}
  .protobar{font-size:12px;gap:4px;padding:5px 6px}
  .protobar button{padding:4px 8px}
}
</style>

<div class="protonote">
  <b>Prototipo #5 — architettura dell'informazione, tre varianti.</b>
  Codice usa e getta, non è il prodotto. Il motore di calcolo è quello vero (contratto #4, <span class="num">regole-2026-v1</span>),
  quindi i numeri a schermo sono reali. Cambia variante dalla barra in basso o con ← →.
</div>
<div id="app"></div>
<div class="protobar" id="protobar"></div>
<script>
/* ============================================================
   MOTORE — contratto di calcolo #4, regole-2026-v1
   Virgola fissa su BigInt (scala 1e8). Mai float binario.
   ============================================================ */
const SC=8n,S=10n**8n,CENT=10n**6n,D4=10n**4n;
function d(x){const s=String(x).trim();const neg=s.startsWith('-');
  const[i,f='']=(neg?s.slice(1):s).split('.');
  const frac=(f+'0'.repeat(Number(SC))).slice(0,Number(SC));
  const v=BigInt(i||'0')*S+BigInt(frac||'0');return neg?-v:v;}
const mul=(a,b)=>(a*b)/S;
const rc=a=>{const neg=a<0n,x=neg?-a:a;const q=x/CENT,r=x%CENT;
  const y=(r*2n>=CENT?q+1n:q)*CENT;return neg?-y:y;};
const tr4=a=>(a/D4)*D4;
const nu=a=>Number(a)/1e8;
const K={massimale:d('122295'),sogliaEcc:d('56224'),ivs:d('0.0919'),ecc:d('0.01'),
  irpef:[[d('28000'),d('0.23')],[d('50000'),d('0.33')],[null,d('0.43')]],
  reg:[[d('15000'),d('0.0123')],[d('28000'),d('0.0158')],[d('50000'),d('0.0172')],[null,d('0.0173')]],
  comAliq:d('0.008'),comEsente:d('23000')};

function calcola(ralInput,mensilita){
  const RAL=rc(d(ralInput)),v=[];
  const push=(id,et,tipo,base,imp,fonte,formula)=>v.push({id,et,tipo,base:nu(base),
    importo:nu(rc(imp)),_i:rc(imp),fonte,formula});
  const baseC=RAL<K.massimale?RAL:K.massimale;
  const ivs=mul(baseC,K.ivs);
  const ecc=baseC>K.sogliaEcc?mul(baseC-K.sogliaEcc,K.ecc):0n;
  push('ivs','Contributi previdenziali IVS','contributo',baseC,-ivs,'inps101',
    `${fmt(nu(baseC))} × 9,19%`);
  if(ecc>0n)push('ecc','Contributo aggiuntivo 1%','contributo',baseC-K.sogliaEcc,-ecc,'inps27',
    `(${fmt(nu(baseC))} − 56.224,00) × 1%`);
  const contributi=rc(ivs)+rc(ecc);
  const I=RAL-contributi;
  let lorda=0n,prev=0n;
  for(const[cap,al]of K.irpef){const top=cap===null?I:(I<cap?I:cap);
    if(top>prev)lorda+=mul(top-prev,al);prev=cap===null?prev:cap;if(cap!==null&&I<=cap)break;}
  let detrLav=0n,fdet='';
  if(I<=d('15000')){detrLav=d('1955');fdet='1.955,00 (fisso fino a 15.000 €)';}
  else if(I<=d('28000')){const rap=tr4(((d('28000')-I)*S)/d('13000'));
    detrLav=d('1910')+mul(d('1190'),rap);fdet=`1.910 + 1.190 × ${nu(rap).toFixed(4)}`;}
  else if(I<=d('50000')){const rap=tr4(((d('50000')-I)*S)/d('22000'));
    detrLav=mul(d('1910'),rap);fdet=`1.910 × ${nu(rap).toFixed(4)}  (rapporto troncato a 4 decimali)`;}
  else fdet='0 (imponibile oltre 50.000 €)';
  const b65=(I>d('25000')&&I<=d('35000'))?d('65'):0n;
  const detrLavTot=detrLav+b65;
  let detrUlt=0n,fult='';
  if(I>d('20000')&&I<=d('32000')){detrUlt=d('1000');fult='1.000,00 (imponibile 20–32k)';}
  else if(I>d('32000')&&I<=d('40000')){detrUlt=mul(d('1000'),((d('40000')-I)*S)/d('8000'));
    fult=`1.000 × (40.000 − ${fmt(nu(I))}) ÷ 8.000`;}
  const nettaRaw=(lorda-detrLavTot-detrUlt);
  const netta=nettaRaw>0n?nettaRaw:0n;
  // Capienza: le detrazioni abbattono l'imposta, non sono rimborsabili.
  // Nelle voci entra la quota effettivamente usata, altrimenti la somma non tornerebbe.
  const usoLav=detrLavTot<lorda?detrLavTot:lorda;
  const resto=lorda-usoLav;
  const usoUlt=detrUlt<resto?detrUlt:resto;
  const capiente=(detrLavTot+detrUlt)<=lorda;
  const capNota=q=>capiente?'':`  ⚠ capienza: usata ${fmt(nu(q))} € — le detrazioni non sono rimborsabili`;
  push('lorda','IRPEF lorda','imposta',I,-lorda,'l199',
    `23% × min(${fmt(nu(I))}; 28.000) + 33% sulla quota 28–50k + 43% oltre`);
  push('detrlav',b65>0n?'Detrazione lavoro dipendente (+65 €)':'Detrazione lavoro dipendente','detrazione',
    I,usoLav,'tuir13',fdet+(b65>0n?'  +65 (imponibile 25–35k)':'')+
    (capiente?'':`  →  spettante ${fmt(nu(detrLavTot))} €,${capNota(usoLav)}`));
  if(detrUlt>0n)push('detrult','Ulteriore detrazione','detrazione',I,usoUlt,'l207c6',
    fult+(capiente?'':`  →  spettante ${fmt(nu(detrUlt))} €,${capNota(usoUlt)}`));
  const dovute=netta>0n;
  let reg=0n;prev=0n;
  if(dovute)for(const[cap,al]of K.reg){const top=cap===null?I:(I<cap?I:cap);
    if(top>prev)reg+=mul(top-prev,al);prev=cap===null?prev:cap;if(cap!==null&&I<=cap)break;}
  const com=(dovute&&I>K.comEsente)?mul(I,K.comAliq):0n;
  push('addreg','Addizionale regionale Lombardia','imposta',I,-reg,'lomb',
    dovute?'1,23% fino a 15k · 1,58% 15–28k · 1,72% 28–50k · 1,73% oltre':'0 — non dovuta: IRPEF netta è zero');
  push('addcom','Addizionale comunale Milano','imposta',I,-com,'mi',
    !dovute?'0 — non dovuta: IRPEF netta è zero':(I>K.comEsente?`${fmt(nu(I))} × 0,8% (sull'intero imponibile)`:'0 — esente fino a 23.000 € di imponibile'));
  let somma=0n,fsom='';
  if(I<=d('20000')){const al=I<=d('8500')?d('0.071'):(I<=d('15000')?d('0.053'):d('0.048'));
    somma=mul(I,al);fsom=`${fmt(nu(I))} × ${(nu(al)*100).toFixed(1).replace('.',',')}%`;}
  const ti=(I<=d('15000')&&lorda>(detrLav-d('75')))?d('1200'):0n;
  if(somma>0n)push('somma','Somma non imponibile (cuneo)','integrazione',I,somma,'l207c4',fsom);
  if(ti>0n)push('ti','Trattamento integrativo','integrazione',I,ti,'dl3',
    '1.200,00 — imponibile ≤ 15.000 e IRPEF lorda > detrazione − 75');
  const netto=v.reduce((a,x)=>a+x._i,RAL);
  const imposte=rc(netta)+rc(reg)+rc(com);
  const media=rc((netto*S)/d(String(mensilita)));
  const somme=v.reduce((a,x)=>a+x._i,0n);
  return{input:{ral:nu(RAL),mensilita},versioneRegole:'regole-2026-v1',
    voci:v.map(({_i,...r})=>r),
    kpi:{nettoAnnuo:nu(netto),mediaMensile:nu(media),totaleImposte:nu(imposte),totaleContributi:nu(contributi)},
    imponibile:nu(I),irpefNetta:nu(rc(netta)),integrazioni:nu(rc(somma)+rc(ti)),
    aliquotaContributivaEffettiva:RAL>0n?nu(mul(((contributi*S)/RAL),d('100'))):0,
    riconciliazione:{verificata:netto===RAL+somme,identita:'RAL − contributi − imposte + integrazioni = netto annuo'}};
}

/* ---------- formattazione ---------- */
const grp=i=>i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fmt=n=>{const neg=n<0,x=Math.abs(n).toFixed(2),[i,f]=x.split('.');
  return (neg?'−':'')+grp(i)+','+f;};
const fmt0=n=>grp(String(Math.round(Math.abs(n))));
const eur=n=>fmt(n)+' €';
const parseRal=s=>{const t=String(s).trim().replace(/\s|€/g,'');
  if(t==='')return null;
  let x=t;
  if(/^-/.test(t))return '-1';                                // negativo: blocca con messaggio dedicato
  if(/,/.test(t))x=t.replace(/\./g,'').replace(',','.');      // 35.000,50
  else if(/\.\d{3}(\D|$)/.test(t))x=t.replace(/\./g,'');       // 35.000
  if(/^-\d/.test(x))return '-1';                              // negativo: blocca con messaggio dedicato
  if(!/^\d+(\.\d+)?$/.test(x))return NaN;
  return x;};

/* ---------- fonti (una sola sorgente contenutistica, riusata ovunque) ---------- */
const FONTI={
  inps101:['INPS, circolare 101/2024 — aliquota IVS 9,19% a carico del lavoratore','https://www.inps.it/it/it/inps-comunica/atti/circolari-messaggi-e-normativa/dettaglio.circolari-e-messaggi.2024.11.circolare-numero-101-del-29-11-2024_14714.html'],
  inps27:['INPS, circolare 27/2026 — prima fascia 56.224 € e massimale 122.295 €','https://www.inps.it/it/it/inps-comunica/atti/circolari-messaggi-e-normativa/dettaglio.circolari-e-messaggi.2026.03.circolare-numero-27-del-11-03-2026_15198.html'],
  l199:['L. 199/2025 art. 1 c. 3 — scaglioni IRPEF 2026: 23 / 33 / 43%','https://www.normattiva.it/eli/stato/LEGGE/2025/12/30/199/CONSOLIDATED'],
  tuir13:['TUIR art. 13 — detrazione da lavoro dipendente e maggiorazione di 65 €','https://def.giustiziatributaria.gov.it/DocTribFrontend/getAttoNormativoDetail.do?ACTION=getArticolo&articolo=Articolo+13&id=%7B31D694E8-4398-4030-873B-FEAF5A6647F9%7D'],
  l207c4:['L. 207/2024 art. 1 c. 4-5 — somma non imponibile fino a 20.000 € di reddito','https://www.normattiva.it/eli/stato/LEGGE/2024/12/30/207/CONSOLIDATED/20251219'],
  l207c6:['L. 207/2024 art. 1 c. 6 — ulteriore detrazione 20–40k','https://www.normattiva.it/eli/stato/LEGGE/2024/12/30/207/CONSOLIDATED/20251219'],
  dl3:['D.L. 3/2020 art. 1 — trattamento integrativo','https://www.normattiva.it/atto/caricaDettaglioAtto?atto.codiceRedazionale=20A02005&atto.dataPubblicazioneGazzetta=2020-04-04&tipoDettaglio=multivigenza'],
  lomb:['Regione Lombardia — addizionale regionale IRPEF progressiva','https://www.regione.lombardia.it/bollo-auto-e-tributi-regionali/red-addizionale-regionale-irpef'],
  mi:['Comune di Milano — addizionale comunale 0,8%, esenzione fino a 23.000 €','https://www.comune.milano.it/argomenti/tributi/addizionale-comunale-irpef'],
};
const LIMITI=[
  ['Il 9,19% è una scelta di modello','Non è l\'aliquota di ogni impiegato privato: inquadramento INPS, settore, dimensione del datore e fondi speciali possono cambiarla. Qui si assume FPLD ordinario, senza contribuzioni settoriali.'],
  ['«RAL» non è una base legale autonoma','È una convenzione retributiva. Il calcolo assume RAL = imponibile previdenziale = imponibile fiscale prima dei contributi, senza componenti variabili, benefit o rimborsi.'],
  ['Competenza, non cassa','È il carico maturato sulla RAL 2026, non il cash trattenuto nei cedolini del 2026: le addizionali si pagano a rate dopo il conguaglio. La cifra mensile è una media, non l\'importo di una busta paga.'],
  ['Sopra 122.295 € si assume la prima iscrizione dal 1996','Il massimale contributivo vale solo per chi è privo di anzianità al 31/12/1995. È l\'unico punto in cui la sola RAL non basta più.'],
];
const FAQ=[
  ['Perché il netto mensile non coincide con la mia busta paga?','Il calcolo è annuale e di competenza. Le addizionali vengono trattenute a rate nell\'anno successivo al conguaglio, la tredicesima non beneficia delle stesse detrazioni mensili e il conguaglio di fine anno riequilibra tutto. Per questo il numero è etichettato <b>media</b> e non «importo del cedolino».'],
  ['Perché scegliere 12 o 13 mensilità non cambia il netto annuo?','Perché non è un dato di calcolo: è solo il divisore con cui si presenta lo stesso netto annuo. Le trattenute non cambiano. Se cambiasse il netto annuo, sarebbe un errore.'],
  ['Perché a volte un euro lordo in più fa <em>scendere</em> il netto?','Perché alcune misure sono esenzioni con soglia secca, non franchigie: superata la soglia si perdono per intero. L\'esempio più forte è l\'esenzione comunale di Milano: a 25.327,62 € di RAL un centesimo lordo in più costa circa 184 € netti. È corretto, non è un bug — ed è il motivo per cui queste soglie vanno mostrate invece che nascoste.'],
  ['Cosa non è incluso?','TFR, costo azienda e contributi del datore, INAIL, CCNL e fondi di solidarietà, fondi sanitari e previdenza complementare, familiari a carico, altri redditi, oneri deducibili e detraibili, benefit, premi e agevolazioni personali. Nessuno di questi è ricavabile dalla sola RAL.'],
  ['Da dove vengono le regole?','Da fonti primarie: leggi di bilancio 2025 e 2026, TUIR, circolari INPS, siti ufficiali di Regione Lombardia e Comune di Milano. Ogni voce del dettaglio rimanda al proprio riferimento.'],
];
/* ---------- soglie: il motore emette fatti, la UI decide quando mostrarli ---------- */
const SALTI=[
  ['9001.12','si attiva il trattamento integrativo'],
  ['9360.21','scattano le addizionali e la somma non imponibile passa dal 7,1% al 5,3%'],
  ['16518.02','decade il trattamento integrativo (imponibile 15.000 €)'],
  ['22024.02','la somma non imponibile lascia il posto all\'ulteriore detrazione (imponibile 20.000 €)'],
  ['25327.62','finisce l\'esenzione dell\'addizionale comunale di Milano (imponibile 23.000 €)'],
  ['27530.02','si attiva la maggiorazione di 65 € (imponibile 25.000 €)'],
  ['38542.02','decade la maggiorazione di 65 € (imponibile 35.000 €)'],
];
const PENDENZE=[
  ['30833.61','inizia lo scaglione IRPEF al 33%'],
  ['55060.02','inizia lo scaglione IRPEF al 43%'],
  ['56224.00','inizia il contributo aggiuntivo dell\'1%'],
  ['122295.00','si raggiunge il massimale contributivo'],
];
let SOGLIE=null;
function soglie(){
  if(SOGLIE)return SOGLIE;
  SOGLIE=SALTI.map(([r,causa])=>{
    const hi=calcola(r,13).kpi.nettoAnnuo;
    const lo=calcola((Number(r)-0.01).toFixed(2),13).kpi.nettoAnnuo;
    return{ral:Number(r),tipo:'salto',causa,delta:Math.round((hi-lo)*100)/100};
  }).concat(PENDENZE.map(([r,causa])=>({ral:Number(r),tipo:'pendenza',causa,delta:0})));
  SOGLIE.sort((a,b)=>a.ral-b.ral);
  return SOGLIE;
}
function soglieVicine(ral,finestra){
  const s=soglie().filter(x=>x.tipo==='salto');
  const sopra=s.filter(x=>x.ral>ral).sort((a,b)=>a.ral-b.ral)[0];
  const sotto=s.filter(x=>x.ral<=ral).sort((a,b)=>b.ral-a.ral)[0];
  const out=[];
  if(sopra&&sopra.ral-ral<=finestra)out.push({...sopra,dist:sopra.ral-ral,dir:'sopra'});
  if(sotto&&ral-sotto.ral<=finestra)out.push({...sotto,dist:ral-sotto.ral,dir:'sotto'});
  return out;
}
</script>
<script>
/* ============================================================
   COMPONENTI CONDIVISI — una sola sorgente per spiegazioni e fonti
   ============================================================ */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const C={contrib:'var(--contrib)',tax:'var(--tax)',netto:'var(--netto)',integr:'var(--integr)'};

function badgeAssunzioni(){
  return `<div class="assunzioni" aria-label="Assunzioni del calcolo">
    <span>Milano</span><span>settore privato</span><span>tempo indeterminato</span>
    <span>anno intero</span><span>nessuna agevolazione personale</span></div>`;
}
function inputBlock(st,{grande=true}={}){
  const err=st.errore?`<div class="err" role="alert">${esc(st.errore)}</div>`:'';
  return `<div>
    <div class="badge">Calcolo stipendio netto 2026</div>
    <div style="margin-top:12px">
      <label class="fld" for="ral">Retribuzione annua lorda</label>
      <div class="ralbox"><span class="eur">€</span>
        <input id="ral" inputmode="decimal" autocomplete="off" value="${esc(st.ralRaw)}"
          aria-describedby="ralhint" placeholder="35.000">
      </div>
      ${err}
      <div class="hint" id="ralhint" style="margin-top:7px">Unico dato richiesto. Le regole 2026 e Milano sono fissate.</div>
    </div>
    <div style="margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="seg" role="group" aria-label="Mensilità per la media">
        <button data-m="12" aria-pressed="${st.mensilita===12}">12 mensilità</button>
        <button data-m="13" aria-pressed="${st.mensilita===13}">13 mensilità</button>
      </div>
      <span class="hint">Solo presentazione: non cambia il netto annuo.</span>
    </div>
    ${badgeAssunzioni()}
  </div>`;
}
function kpiBlock(res,{hero=false}={}){
  const k=res.kpi;
  return `<div class="kpis">
    <div class="kpi netto ${hero?'hero':''}"><div class="k">Netto annuo</div><div class="v num">${eur(k.nettoAnnuo)}</div></div>
    <div class="kpi ${hero?'hero':''}"><div class="k">Media su ${res.input.mensilita}</div><div class="v num">${eur(k.mediaMensile)}</div></div>
    <div class="kpi"><div class="k">Totale imposte</div><div class="v num">${eur(k.totaleImposte)}</div></div>
    <div class="kpi"><div class="k">Totale contributi</div><div class="v num">${eur(k.totaleContributi)}</div></div>
    <div class="kpi"><div class="k">Aliquota contributiva</div><div class="v num">${res.aliquotaContributivaEffettiva.toFixed(2).replace('.',',')}%</div></div>
  </div>`;
}
/* ---- money flow: Sankey ristretto alla RAL ---- */
function sankey(res,h,fs){
  const ral=res.input.ral,co=res.kpi.totaleContributi,im=res.imponibile,
        tx=res.kpi.totaleImposte,ne=res.kpi.nettoAnnuo,ig=res.integrazioni;
  if(ral<=0)return '<p class="hint">Inserisci una RAL per vedere il flusso.</p>';
  const H=h||250,W=760,NW=13,GAP=26,top=34,tot=ral+ig,sc=(H-top-14)/tot,FS=fs||12;
  const x1=6,x2=372,x3=W-NW-6;
  const hRal=ral*sc,hIg=ig*sc,hCo=co*sc,hIm=im*sc,hTx=tx*sc,hNe=ne*sc;
  const yRal=top,yIg=top+hRal+GAP,yCo=top,yIm=top+hCo+GAP,yTx=top,yNe=top+hTx+GAP;
  const rib=(xa,ya1,ya2,xb,yb1,yb2,col)=>{const m=(xa+xb)/2;
    return `<path d="M${xa},${ya1} C${m},${ya1} ${m},${yb1} ${xb},${yb1} L${xb},${yb2} C${m},${yb2} ${m},${ya2} ${xa},${ya2} Z" fill="${col}" opacity=".26"/>`;};
  const node=(x,y,hh,col)=>`<rect x="${x}" y="${y}" width="${NW}" height="${Math.max(hh,2)}" rx="3" fill="${col}"/>`;
  const lab=(x,y,t,v,anchor)=>`<text x="${x}" y="${y-17}" text-anchor="${anchor}">${esc(t)}</text>
    <text class="n" x="${x}" y="${y-3}" text-anchor="${anchor}">${eur(v)}</text>`;
  const band=(id,inner,label)=>`<g class="band" tabindex="0" role="button" data-band="${id}"
     aria-label="${esc(label)}">${inner}</g>`;
  return `<svg class="flowsvg" viewBox="0 0 ${W} ${H}" style="font-size:${FS}px" role="img"
      aria-label="Flusso: dalla RAL di ${eur(ral)} a un netto di ${eur(ne)}">
    <title>Dove va la RAL</title>
    ${band('contributi',rib(x1+NW,yRal,yRal+hCo,x2,yCo,yCo+hCo,C.contrib)+node(x2,yCo,hCo,C.contrib),
      `Contributi ${eur(co)}`)}
    ${rib(x1+NW,yRal+hCo,yRal+hRal,x2,yIm,yIm+hIm,'var(--ink-3)')}
    ${band('imposte',rib(x2+NW,yIm,yIm+hTx,x3,yTx,yTx+hTx,C.tax)+node(x3,yTx,hTx,C.tax),
      `Imposte ${eur(tx)}`)}
    ${rib(x2+NW,yIm+hTx,yIm+hIm,x3,yNe,yNe+(hIm-hTx),C.netto)}
    ${ig>0?band('integrazioni',rib(x1+NW,yIg,yIg+hIg,x3,yNe+(hIm-hTx),yNe+hNe,C.integr)+node(x1,yIg,hIg,C.integr),
      `Integrazioni ${eur(ig)}`):''}
    ${node(x1,yRal,hRal,'var(--ink-2)')}
    ${node(x2,yIm,hIm,'var(--ink-3)')}
    ${band('netto',node(x3,yNe,hNe,C.netto),`Netto ${eur(ne)}`)}
    ${lab(x1,yRal,'RAL',ral,'start')}
    ${ig>0?lab(x1,yIg,'Integrazioni di legge',ig,'start'):''}
    ${lab(x2,yCo,'Contributi',co,'start')}
    ${lab(x2,yIm,'Imponibile IRPEF',im,'start')}
    ${lab(x3+NW,yTx,'Imposte',tx,'end')}
    ${lab(x3+NW,yNe,'Netto annuo',ne,'end')}
  </svg>
  <p class="sr">Equivalente testuale: RAL ${eur(ral)}, meno contributi ${eur(co)}, imponibile ${eur(im)},
    meno imposte ${eur(tx)}${ig>0?`, più integrazioni di legge ${eur(ig)}`:''}, netto annuo ${eur(ne)}.
    La stessa scomposizione è nella tabella del dettaglio.</p>`;
}
function legenda(res){
  const items=[['var(--contrib)','Contributi'],['var(--tax)','Imposte'],['var(--netto)','Netto']];
  if(res.integrazioni>0)items.push(['var(--integr)','Integrazioni di legge']);
  return `<div class="legend">${items.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
}
function stackbar(res){
  const ral=res.input.ral;if(ral<=0)return '';
  const p=x=>Math.max(0,x/ral*100);
  const seg=(w,c,t)=>w>12?`<div style="width:${w}%;background:${c}" title="${esc(t)}">${t}</div>`
    :`<div style="width:${w}%;background:${c}" title="${esc(t)}"></div>`;
  return `<div class="stackbar" role="img" aria-label="Ripartizione della RAL: contributi ${p(res.kpi.totaleContributi).toFixed(1)}%, imposte ${p(res.kpi.totaleImposte).toFixed(1)}%, netto ${p(res.kpi.nettoAnnuo-res.integrazioni).toFixed(1)}%">
    ${seg(p(res.kpi.totaleContributi),C.contrib,'Contributi')}
    ${seg(p(res.kpi.totaleImposte),C.tax,'Imposte')}
    ${seg(p(res.kpi.nettoAnnuo-res.integrazioni),C.netto,'Netto')}
  </div>`;
}
/* ---- dettaglio a operatori firmati, riconciliabile ---- */
function ledger(res,st){
  const v=id=>res.voci.find(x=>x.id===id);
  const row=(op,label,val,voce,cls='')=>{
    const id=voce?voce.id:null;
    const open=id&&st.aperta===id;
    const name=id?`<button class="rowbtn" data-voce="${id}" aria-expanded="${open}">
        <span class="chev">▶</span><span>${esc(label)}</span></button>`:esc(label);
    let out=`<tr class="${cls}"><td class="op">${op}</td><td>${name}</td>
      <td class="amt num">${eur(Math.abs(val))}</td></tr>`;
    if(open){const[t,u]=FONTI[voce.fonte];
      out+=`<tr><td></td><td colspan="2"><div class="explain">
        <div><b>Come si calcola</b></div><code>${esc(voce.formula||'—')}</code>
        <div class="src">Fonte: <a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></div>
      </div></td></tr>`;}
    return out;
  };
  const g=[];
  g.push(`<tr class="sub"><td></td><td colspan="2" style="padding-top:14px;font-weight:700;color:var(--ink)">Dalla RAL all'imponibile</td></tr>`);
  g.push(row('','RAL',res.input.ral,null));
  g.push(row('−',v('ivs').et,v('ivs').importo,v('ivs')));
  if(v('ecc'))g.push(row('−',v('ecc').et,v('ecc').importo,v('ecc')));
  g.push(row('=','Imponibile IRPEF',res.imponibile,null,'sub'));
  g.push(`<tr class="sub"><td></td><td colspan="2" style="padding-top:14px;font-weight:700;color:var(--ink)">IRPEF</td></tr>`);
  g.push(row('−',v('lorda').et,v('lorda').importo,v('lorda')));
  g.push(row('+',v('detrlav').et,v('detrlav').importo,v('detrlav')));
  if(v('detrult'))g.push(row('+',v('detrult').et,v('detrult').importo,v('detrult')));
  g.push(row('=','IRPEF netta',res.irpefNetta,null,'sub'));
  g.push(`<tr class="sub"><td></td><td colspan="2" style="padding-top:14px;font-weight:700;color:var(--ink)">Addizionali locali</td></tr>`);
  g.push(row('−',v('addreg').et,v('addreg').importo,v('addreg')));
  g.push(row('−',v('addcom').et,v('addcom').importo,v('addcom')));
  if(v('somma')||v('ti')){
    g.push(`<tr class="sub"><td></td><td colspan="2" style="padding-top:14px;font-weight:700;color:var(--ink)">Integrazioni di legge</td></tr>`);
    if(v('somma'))g.push(row('+',v('somma').et,v('somma').importo,v('somma')));
    if(v('ti'))g.push(row('+',v('ti').et,v('ti').importo,v('ti')));
  }
  g.push(`<tr class="total"><td class="op">=</td><td>Netto annuo</td>
    <td class="amt num">${eur(res.kpi.nettoAnnuo)}</td></tr>`);
  const parts=[fmt(res.input.ral),'− '+fmt(res.kpi.totaleContributi),'− '+fmt(res.kpi.totaleImposte)]
    .concat(res.integrazioni>0?['+ '+fmt(res.integrazioni)]:[]);
  return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <table class="ledger"><caption class="sr">Dettaglio delle voci, dalla RAL al netto annuo</caption>
    <thead><tr><th></th><th>Voce</th><th style="text-align:right">Importo</th></tr></thead>
    <tbody>${g.join('')}</tbody></table></div>
    <div class="notice info" style="margin-top:12px">
      <span class="ico" aria-hidden="true">${res.riconciliazione.verificata?'✓':'✕'}</span>
      <span><b>Ogni euro torna.</b> <span class="num">${parts.join(' ')} = ${fmt(res.kpi.nettoAnnuo)} €</span>
      — verificato a ogni ricalcolo, non solo nei test.</span></div>`;
}
/* ---- soglie: finestra di visibilità decisa qui, non nel motore ---- */
function noticeSoglie(res,st){
  if(res.input.ral<=0)return '';
  const vic=soglieVicine(res.input.ral,st.finestra);
  if(!vic.length)return '';
  return vic.map(s=>{
    const su=s.dir==='sopra';
    const verso=s.delta>0?'sale':'scende';
    return `<div class="notice warn"><span class="ico" aria-hidden="true">${su?'▲':'▼'}</span><span>
      <b>${su?`A ${eur(s.ral)} di RAL`:`Hai appena superato ${eur(s.ral)}`}</b> il netto ${verso} di
      <span class="num">${eur(Math.abs(s.delta))}</span> di colpo: ${esc(s.causa)}.
      ${su?`Sono <span class="num">${eur(s.dist)}</span> più della tua RAL.`:''}
      È una soglia di legge, non un errore di arrotondamento.</span></div>`;
  }).join('');
}
function eegg(res){
  if(res.input.ral<=1000000)return '';
  return `<div class="eegg"><b>Con una RAL a sette cifre, il netto mensile forse non è la tua
    preoccupazione principale.</b> Il conto però resta corretto, e dice una cosa vera: sopra il massimale
    di 122.295 € i contributi si fermano, quindi stai versando il
    <span class="num">${res.aliquotaContributivaEffettiva.toFixed(2).replace('.',',')}%</span> di contributi.
    Chi guadagna 30.000 € ne versa il 9,19%.</div>`;
}
function spiegaCallout(res,st){
  if(!st.spiega)return '';
  return `<div class="notice info"><span class="ico" aria-hidden="true">💡</span><span>
    <b>I contributi non sono tasse.</b> Riducono il netto e anche la base IRPEF, ma finanziano la tua
    posizione previdenziale. Le imposte vere sono IRPEF e addizionali: qui valgono
    <span class="num">${eur(res.kpi.totaleImposte)}</span>, cioè il
    <span class="num">${(res.kpi.totaleImposte/res.input.ral*100).toFixed(1).replace('.',',')}%</span> della RAL.</span></div>`;
}
function metodo(compatto){
  return `<div class="stack">
    <div><h3 style="font-size:15px">Come è costruito il calcolo</h3>
      <p style="color:var(--ink-2);font-size:13.5px;margin:8px 0 0">
      Tredici passi in ordine vincolante: contributi, imponibile, IRPEF lorda per scaglioni, detrazioni,
      IRPEF netta, addizionali (dovute solo se l'IRPEF netta è positiva), integrazioni di legge.
      Aritmetica decimale al centesimo; il netto è la somma delle voci arrotondate, così la tabella
      chiude sempre. Versione delle regole: <span class="num">regole-2026-v1</span>.</p></div>
    <div>${compatto?`<details class="acc"><summary><span>Fonti (${Object.keys(FONTI).length})</span></summary><div class="body">`:'<h3 style="font-size:15px">Fonti</h3>'}
      <ul class="tight" style="font-size:13.5px">
      ${Object.values(FONTI).map(([t,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join('')}
      </ul>${compatto?'</div></details>':''}</div>
    <div><h3 style="font-size:15px">Limiti dichiarati</h3>
      <div>${LIMITI.map(([t,b])=>`<details class="acc"><summary><span>${esc(t)}</span></summary>
        <div class="body">${esc(b)}</div></details>`).join('')}</div></div>
  </div>`;
}
function faq(){
  return `<div>${FAQ.map(([q,a])=>`<details class="acc"><summary><span>${q}</span></summary>
    <div class="body">${a}</div></details>`).join('')}</div>`;
}
</script>
<script>
/* ============================================================
   TRE VARIANTI — stessa domanda, tre architetture dell'informazione
   ============================================================ */
const VARIANTI={
  A:{nome:'Il flusso',claim:'Il money flow è la risposta: si scorre e si scende nel dettaglio.'},
  B:{nome:'Il libro mastro',claim:'La verificabilità è la risposta: due colonne, tabella protagonista.'},
  C:{nome:'La risposta secca',claim:'Un numero solo, il resto a livelli dietro le schede.'},
};

/* ---- A: colonna singola, il flusso è l'eroe ---- */
function variantA(res,st){
  return `<div class="wrap"><div class="stack">
    <header><h1 style="font-size:26px">Dove va la tua RAL</h1>
      <p class="dim" style="margin:6px 0 0;font-size:14px">Inserisci il lordo annuo: vedi cosa resta e perché.</p></header>
    <div class="card pad">${inputBlock(st)}</div>
    ${res?`
    <div class="card pad">
      <h2 style="font-size:16px;margin-bottom:4px">Il percorso di ${eur(res.input.ral)}</h2>
      <p class="hint" style="margin-bottom:8px">Le larghezze sono in scala. Clicca un flusso per aprirne le voci.</p>
      ${sankey(res,250,12)}
      ${legenda(res)}
    </div>
    ${kpiBlock(res,{hero:true})}
    ${noticeSoglie(res,st)}
    ${spiegaCallout(res,st)}
    ${eegg(res)}
    <div class="card pad">
      <h2 style="font-size:16px;margin-bottom:10px">Il dettaglio, voce per voce</h2>
      ${ledger(res,st)}
    </div>
    <div class="card pad"><h2 style="font-size:16px;margin-bottom:6px">Metodo e fonti</h2>${metodo()}</div>
    <div class="card pad"><h2 style="font-size:16px;margin-bottom:6px">Domande frequenti</h2>${faq()}</div>
    `:''}
  </div></div>`;
}

/* ---- B: due colonne, la tabella è l'eroe ---- */
function variantB(res,st){
  return `<div class="wrap"><div class="cols two">
    <div class="sticky stack">
      <div class="card pad">${inputBlock(st)}</div>
      ${res?`<div class="card pad"><div class="stack">
        <div><div class="kpi netto hero" style="border:0;padding:0">
          <div class="k">Netto annuo</div><div class="v num">${eur(res.kpi.nettoAnnuo)}</div></div>
          <div class="hint" style="margin-top:4px">media su ${res.input.mensilita}:
            <b class="num">${eur(res.kpi.mediaMensile)}</b></div></div>
        ${stackbar(res)}
        ${legenda(res)}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div class="kpi"><div class="k">Imposte</div><div class="v num" style="font-size:17px">${eur(res.kpi.totaleImposte)}</div></div>
          <div class="kpi"><div class="k">Contributi</div><div class="v num" style="font-size:17px">${eur(res.kpi.totaleContributi)}</div></div>
        </div>
        <div class="hint">Aliquota contributiva effettiva
          <b class="num">${res.aliquotaContributivaEffettiva.toFixed(2).replace('.',',')}%</b></div>
      </div></div>
      <div class="card pad"><h2 style="font-size:15px;margin-bottom:6px">Metodo e fonti</h2>${metodo(true)}</div>`:''}
    </div>
    <div class="stack">
      ${res?`
      ${noticeSoglie(res,st)}
      ${spiegaCallout(res,st)}
      ${eegg(res)}
      <div class="card pad">
        <h2 style="font-size:18px;margin-bottom:2px">Dalla RAL al netto, riga per riga</h2>
        <p class="hint" style="margin-bottom:12px">Ogni riga si apre e mostra formula e fonte.</p>
        ${ledger(res,st)}
      </div>
      <div class="card pad">
        <h2 style="font-size:16px;margin-bottom:8px">Lo stesso conto, come flusso</h2>
        ${sankey(res,230,14)}
      </div>
      <div class="card pad"><h2 style="font-size:16px;margin-bottom:6px">Domande frequenti</h2>${faq()}</div>
      `:'<div class="card pad dim">Inserisci una RAL per vedere il dettaglio.</div>'}
    </div>
  </div></div>`;
}

/* ---- C: la risposta prima di tutto, il resto a schede ---- */
function variantC(res,st){
  const tab=st.tab;
  const panel=()=>{
    if(!res)return '';
    if(tab==='flusso')return `<div class="stack">${sankey(res,250,17)}${legenda(res)}
      ${kpiBlock(res)}${spiegaCallout(res,st)}</div>`;
    if(tab==='dettaglio')return ledger(res,st);
    if(tab==='metodo')return `<div class="stack">${metodo()}
      <div><h3 style="font-size:15px;margin-bottom:4px">Domande frequenti</h3>${faq()}</div></div>`;
    return '';
  };
  return `<div class="wrap narrow"><div class="stack">
    <div class="card pad">${inputBlock(st)}</div>
    ${res?`
    <div class="card answer">
      <div class="lbl">Netto, media su ${res.input.mensilita}</div>
      <div class="big num">${eur(res.kpi.mediaMensile)}</div>
      <div class="sub">Su una RAL di <b class="num">${eur(res.input.ral)}</b> restano
        <b class="num">${eur(res.kpi.nettoAnnuo)}</b> l'anno.</div>
      <div style="margin-top:16px">${stackbar(res)}${legenda(res)}</div>
    </div>
    ${noticeSoglie(res,st)}
    ${eegg(res)}
    <div class="card">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="flusso" aria-selected="${tab==='flusso'}">Il flusso</button>
        <button role="tab" data-tab="dettaglio" aria-selected="${tab==='dettaglio'}">Il dettaglio</button>
        <button role="tab" data-tab="metodo" aria-selected="${tab==='metodo'}">Metodo, fonti e FAQ</button>
      </div>
      <div class="pad" role="tabpanel">${panel()}</div>
    </div>`:''}
  </div></div>`;
}

/* ============================================================
   STATO, URL, EVENTI
   ============================================================ */
const st={ralRaw:'35.000',mensilita:13,variant:'A',spiega:false,finestra:500,aperta:null,tab:'flusso',errore:null};
function fromURL(){
  const p=new URLSearchParams(location.search);
  if(p.get('variant')&&VARIANTI[p.get('variant').toUpperCase()])st.variant=p.get('variant').toUpperCase();
  if(p.get('ral'))st.ralRaw=p.get('ral');
  if(p.get('m'))st.mensilita=p.get('m')==='12'?12:13;
  if(p.get('spiega'))st.spiega=p.get('spiega')==='1';
  if(p.get('w'))st.finestra=Number(p.get('w'))||500;
  if(p.get('tab'))st.tab=p.get('tab');
}
function toURL(){
  const p=new URLSearchParams();
  p.set('variant',st.variant);p.set('ral',st.ralRaw);p.set('m',String(st.mensilita));
  if(st.spiega)p.set('spiega','1');
  p.set('w',String(st.finestra));
  if(st.variant==='C')p.set('tab',st.tab);
  history.replaceState(null,'','?'+p.toString());
}
function risultato(){
  st.errore=null;
  const v=parseRal(st.ralRaw);
  if(v===null)return null;
  if(Number.isNaN(v)){st.errore='Inserisci un numero: solo cifre, con virgola o punto per i decimali.';return null;}
  if(Number(v)<0){st.errore='La RAL non può essere negativa.';return null;}
  if(Number(v)>9999999){st.errore='Oltre 9.999.999 € il calcolo esce dal perimetro dichiarato.';return null;}
  return calcola(v,st.mensilita);
}
function protobar(){
  const ks=Object.keys(VARIANTI),i=ks.indexOf(st.variant);
  return `<button data-nav="-1" aria-label="Variante precedente">←</button>
    <span class="vlabel">${st.variant} — ${VARIANTI[st.variant].nome}</span>
    <button data-nav="1" aria-label="Variante successiva">→</button>
    <span class="sep"></span>
    <button data-spiega aria-pressed="${st.spiega}">Spiegami il calcolo</button>
    <span class="sep"></span>
    <label style="display:flex;align-items:center;gap:5px">soglie entro
      <select data-finestra>
        ${[0,100,500,1500,4000].map(w=>`<option value="${w}" ${st.finestra===w?'selected':''}>${w===0?'mai':fmt0(w)+' €'}</option>`).join('')}
      </select></label>`;
}
function render(){
  const res=risultato();
  const el=document.getElementById('app');
  const focusId=document.activeElement&&document.activeElement.id;
  const sel=document.activeElement&&document.activeElement.selectionStart;
  el.innerHTML=st.variant==='A'?variantA(res,st):st.variant==='B'?variantB(res,st):variantC(res,st);
  document.getElementById('protobar').innerHTML=protobar();
  document.title=`Prototipo IA — RAL → netto (${st.variant})`;
  if(focusId==='ral'){const n=document.getElementById('ral');
    if(n){n.focus();try{n.setSelectionRange(sel,sel);}catch(e){}}}
  toURL();
}
function cycle(dir){
  const ks=Object.keys(VARIANTI);
  st.variant=ks[(ks.indexOf(st.variant)+dir+ks.length)%ks.length];
  st.aperta=null;render();
}
document.addEventListener('input',e=>{
  if(e.target.id==='ral'){st.ralRaw=e.target.value;render();}
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-finestra]')){st.finestra=Number(e.target.value);render();}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-spiega],[data-m],[data-voce],[data-tab],[data-band]');
  if(!t)return;
  if(t.hasAttribute('data-nav'))return cycle(Number(t.dataset.nav));
  if(t.hasAttribute('data-spiega')){st.spiega=!st.spiega;return render();}
  if(t.hasAttribute('data-m')){st.mensilita=Number(t.dataset.m);return render();}
  if(t.hasAttribute('data-voce')){st.aperta=st.aperta===t.dataset.voce?null:t.dataset.voce;return render();}
  if(t.hasAttribute('data-tab')){st.tab=t.dataset.tab;return render();}
  if(t.hasAttribute('data-band')){
    const map={contributi:'ivs',imposte:'lorda',netto:null,integrazioni:'somma'};
    const id=map[t.dataset.band];
    if(st.variant==='C')st.tab='dettaglio';
    st.aperta=id;render();
    const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
    const tb=document.querySelector('table.ledger');
    if(tb)tb.scrollIntoView({behavior:rm?'auto':'smooth',block:'center'});
    return;
  }
});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable)return;
  if(e.key==='ArrowLeft')cycle(-1);
  if(e.key==='ArrowRight')cycle(1);
  if(e.key===' '||e.key==='Enter'){
    const b=e.target.closest('[data-band]');
    if(b){e.preventDefault();b.click();}
  }
});
fromURL();render();
</script>
</body>

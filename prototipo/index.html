<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Cpath%20d%3D%27M6%200H32V26L26%2032H0V6Z%27%20fill%3D%27%231E1C2B%27%2F%3E%3Ctext%20x%3D%2716%27%20y%3D%2723%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%2719%27%20font-weight%3D%27700%27%20fill%3D%27%2321D4E3%27%20text-anchor%3D%27middle%27%3E%E2%82%AC%3C%2Ftext%3E%3C%2Fsvg%3E">
<title>Dove va la tua RAL — netto 2026</title>
<link rel="stylesheet" href="draftsman.css">
<style>
/* ==========================================================================
   La pagina — sopra i token Draftsman. Nessun colore fuori dal sistema.
   ========================================================================== */
body{padding-bottom:0}
.pg{width:min(100% - (var(--gutter) * 2),1180px);margin-inline:auto}
.pg--narrow{max-width:940px}
.chainwrap{overflow-x:auto}

/* --- intestazione: carta a griglia, crocini, titolo in Archivo ---------- */
.pagehero{position:relative;padding:clamp(40px,6vw,84px) 0 clamp(32px,4vw,52px);
  background-image:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0),
    linear-gradient(to right,var(--line) 1px,transparent 1px),
    linear-gradient(to bottom,var(--line) 1px,transparent 1px);
  background-size:24px 24px,192px 192px,192px 192px;
  border-bottom:var(--bw) dashed var(--line-strong)}
.pagehero .inner{position:relative}
.pagehero h1{font-family:var(--font-display);font-weight:800;font-stretch:var(--wdth);
  font-size:clamp(2.6rem,6.4vw,5rem);line-height:var(--lh-tight);letter-spacing:var(--ls-display);
  margin:0 0 var(--s-5);max-width:16ch;text-wrap:balance}
.pagehero p{margin:0;max-width:60ch;font-size:var(--t-lead);line-height:1.5;color:var(--fg-muted)}
.pagehero .meta{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-top:var(--s-6)}
.worklink{display:inline-flex;align-items:center;gap:8px;margin-top:var(--s-6);
  font:400 var(--t-xs)/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;
  text-decoration:none;padding:9px 14px;border:var(--bw) solid var(--line-strong);
  transition:background var(--dur-1) var(--ease-mech),color var(--dur-1) var(--ease-mech)}
.worklink:hover{background:var(--c-flux);border-color:var(--c-flux);color:var(--c-graphite)}
.limit-note{margin-top:var(--s-5)}

/* --- modulo ------------------------------------------------------------- */
.calcbox{margin-top:clamp(24px,3vw,40px);border:var(--bw-thick) solid var(--line-solid);
  background:var(--bg-raised);padding:clamp(20px,3vw,32px);box-shadow:var(--lift-md) var(--line-solid)}
.calcbox.is-dirty{box-shadow:var(--lift-md) var(--c-amber)}
.form-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:var(--s-6);align-items:start}
.geo-grid{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:var(--s-6)}
.calcrow{display:flex;align-items:center;gap:var(--s-4);flex-wrap:wrap;margin-top:var(--s-2)}
.dirty{display:none;align-items:center;gap:8px;font:400 var(--t-xs)/1.4 var(--font-mono);
  color:var(--warn-text)}
.is-dirty .dirty{display:flex}
.field--error .input{border-color:var(--err-text);box-shadow:var(--lift-sm) var(--c-signal-red)}

/* € come prefisso: una casella affiancata, senza raggio */
.ingroup{display:flex}
.ingroup .affix{display:grid;place-items:center;width:44px;flex:none;
  border:var(--bw) solid var(--line-strong);border-right:0;background:var(--bg-sunken);
  font:500 var(--t-sm)/1 var(--font-mono);color:var(--fg-muted)}
.ingroup .input{flex:1}

/* --- nucleo familiare: una riga per persona, l'età in colonna ----------- */
.nucleo{margin-top:var(--s-6);padding-top:var(--s-5);border-top:var(--bw) dashed var(--line-strong)}
.nucleo-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-4);
  flex-wrap:wrap;margin-bottom:var(--s-4)}
.nucleo-tab td{vertical-align:middle}
.nucleo-in{padding-block:8px;font-size:var(--t-sm)}
.nucleo-eta{width:86px}
.nucleo-red{width:118px}
.nucleo-imp{white-space:nowrap;font-weight:600}
.nucleo-perche{font-size:var(--t-xs);color:var(--fg-muted);max-width:36ch}
.nucleo-x{border:0;background:none;cursor:pointer;font:400 var(--t-sm)/1 var(--font-mono);
  color:var(--fg-muted);padding:8px 10px}
.nucleo-x:hover{background:var(--c-signal-red);color:var(--c-graphite)}
.nucleo-azioni{margin-top:var(--s-3)}
.nucleo-vuoto{margin:0;font-size:var(--t-sm);color:var(--fg-muted);max-width:70ch}
.nucleo-nota{margin-top:var(--s-3)}
/* Su schermo stretto la tabella si impila: sei colonne che scorrono
   in orizzontale nasconderebbero proprio la colonna «perché», che è
   la ragione per cui questa tabella esiste. */
@media(max-width:760px){
  .nucleo-tab,.nucleo-tab tbody,.nucleo-tab tr,.nucleo-tab td{display:block;width:auto;min-width:0}
  .nucleo .table-wrap{overflow:visible;border:0;background:none}
  .nucleo-tab thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .nucleo-tab tr{position:relative;background:var(--bg-raised);
    border:var(--bw) solid var(--line-strong);padding:var(--s-2) 46px var(--s-2) var(--s-4);
    margin-bottom:var(--s-3)}
  .nucleo-tab td{border:0;padding:7px 0;display:flex;align-items:center;
    justify-content:space-between;gap:var(--s-4);text-align:right}
  .nucleo-tab td::before{content:attr(data-etichetta);flex:none;text-align:left;
    font:500 var(--t-label)/1.4 var(--font-mono);letter-spacing:var(--ls-label);
    text-transform:uppercase;color:var(--fg-muted)}
  .nucleo-tab td:last-child{position:absolute;top:6px;right:6px;padding:0;display:block}
  .nucleo-tab td:last-child::before{content:none}
  .nucleo-perche{max-width:none}
  .nucleo-eta,.nucleo-red{width:130px}
  .nucleo-tab .select{width:auto;min-width:190px}
}

/* --- sezioni impilate ---------------------------------------------------- */
.sec{position:relative;scroll-margin-top:96px;padding:clamp(44px,6vw,84px) 0;
  border-bottom:var(--bw) dashed var(--line-strong)}
.sec--ink{border-bottom-color:transparent}
.sec .pg{position:relative}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s-5);
  flex-wrap:wrap;margin-bottom:var(--s-2)}
.sec h2{margin:0}
.sec .lead{margin:var(--s-3) 0 0;max-width:74ch}
.sec-body{margin-top:var(--s-6)}
.sec .no{position:absolute;top:var(--s-5);right:0;font:400 var(--t-label)/1 var(--font-mono);
  letter-spacing:var(--ls-label);color:var(--line-strong)}

/* --- navigazione ad ancore ------------------------------------------------ */
.anchors{display:flex;gap:0;flex-wrap:wrap}
.anchors a{text-decoration:none;padding:8px 14px;white-space:nowrap;
  font:400 var(--t-label)/1.6 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--fg-muted);border:var(--bw) solid transparent;
  transition:background var(--dur-1) var(--ease-mech),color var(--dur-1) var(--ease-mech)}
.anchors a:hover{background:var(--c-citron);color:var(--c-graphite)}
.anchors a[aria-current="true"]{background:var(--c-graphite);color:var(--c-fog)}
.anchorbar{position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--c-bone) 90%,transparent);backdrop-filter:blur(10px);
  border-block:var(--bw) solid var(--line-strong)}
.anchorbar .inner{display:flex;align-items:center;justify-content:space-between;gap:var(--s-5);
  padding:9px 0}
.anchorbar .mini{display:flex;align-items:baseline;gap:10px;white-space:nowrap;
  font:400 var(--t-label)/1 var(--font-mono);letter-spacing:var(--ls-label);
  text-transform:uppercase;color:var(--fg-muted)}
.anchorbar .mini b{font-family:var(--font-display);font-stretch:var(--wdth);font-size:1.2rem;
  font-weight:800;letter-spacing:var(--ls-heading);color:var(--fg);
  font-variant-numeric:tabular-nums}

/* --- la risposta ---------------------------------------------------------- */
.answer{display:grid;gap:var(--s-8);align-items:end;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.answer{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}}
.answer .big{font-family:var(--font-display);font-weight:800;font-stretch:var(--wdth);
  font-size:clamp(3rem,8vw,6rem);line-height:.92;letter-spacing:var(--ls-display);
  font-variant-numeric:tabular-nums;margin:var(--s-3) 0 0}
.kpigrid{display:grid;gap:0;border:var(--bw) solid var(--line-strong);
  background:var(--bg-raised);grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.kpigrid>div{padding:var(--s-5);
  border-right:var(--bw) dashed var(--line-strong);
  border-bottom:var(--bw) dashed var(--line-strong);margin:-0.5px;
  display:flex;flex-direction:column;justify-content:space-between;gap:var(--s-3)}
.kpigrid .tile__value{font-size:clamp(1.35rem,2.2vw,1.85rem)}
.kpigrid .tile__label{margin-top:0;min-height:2.6em}
.kpi-lead .tile__value{font-size:clamp(1.9rem,3.4vw,2.75rem)}
.stackbar{display:flex;width:100%;height:44px;border:var(--bw) solid var(--line-solid)}
.stackbar div{display:flex;align-items:center;justify-content:center;overflow:hidden;
  white-space:nowrap;font:500 var(--t-label)/1 var(--font-mono);letter-spacing:.08em;
  text-transform:uppercase;border-right:var(--bw) solid var(--line-solid)}
.stackbar div:last-child{border-right:0}
.legend{display:flex;flex-wrap:wrap;gap:var(--s-5);
  font:400 var(--t-xs)/1.4 var(--font-mono);color:var(--fg-muted)}
.legend i{width:10px;height:10px;display:inline-block;margin-right:8px;vertical-align:-1px;
  border:var(--bw) solid var(--line-solid)}

/* --- flusso (la sezione inchiostro, unica della pagina) ------------------- */
.flowsvg{width:100%;height:auto;display:block;overflow:visible;font-family:var(--font-mono)}
.flowsvg text{fill:var(--fg-muted);font-size:inherit}
.flowsvg text.n{font-weight:500;fill:var(--fg);font-variant-numeric:tabular-nums}
.flowsvg .band{cursor:pointer}
.flowsvg .band:hover,.flowsvg .band:focus{filter:brightness(1.12)}

/* --- cifre chiave --------------------------------------------------------- */
.scagl{display:grid;gap:0;border:var(--bw) dashed var(--line-strong);
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.scagl>div{padding:var(--s-5);border-right:var(--bw) dashed var(--line-strong);
  border-bottom:var(--bw) dashed var(--line-strong);margin:-0.5px}
.scagl .q{font:500 var(--t-label)/1 var(--font-mono);letter-spacing:var(--ls-label);
  text-transform:uppercase;color:var(--fg-muted)}
.scagl .a{font-family:var(--font-display);font-weight:800;font-stretch:var(--wdth);
  font-size:1.75rem;letter-spacing:var(--ls-display);line-height:1.1;margin:var(--s-3) 0 4px}
.scagl .n{font-size:var(--t-xs);color:var(--fg-muted)}

/* --- fonti: schede che condividono le hairline ---------------------------- */
.voci{display:grid;gap:0;border:var(--bw) dashed var(--line-strong);
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.voci>.voce{padding:var(--s-4) var(--s-5);border-right:var(--bw) dashed var(--line-strong);
  border-bottom:var(--bw) dashed var(--line-strong);margin:-0.5px}

/* --- dettaglio: la catena a sinistra, la voce scelta a destra ------------- */
.detsplit{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--s-6);align-items:start}
.chain{width:100%;min-width:330px;border-collapse:collapse;font-variant-numeric:tabular-nums;
  font-size:var(--t-sm)}
.chain td{padding:11px 10px;border-bottom:var(--bw) dashed var(--line)}
.chain tr:last-child td{border-bottom:0}
.chain .op{width:24px;text-align:center;font-family:var(--font-mono);font-size:var(--t-xs);
  font-weight:700;color:var(--fg-muted)}
.chain .amt{text-align:right;white-space:nowrap;font-family:var(--font-mono);font-weight:500}
.chain button.lbl{background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px}
.chain tr.cl{cursor:pointer}
.chain tr.cl:hover td{background:var(--c-citron)}
.chain tr.on td{background:var(--c-flux)}
.chain tr.on button.lbl{font-weight:700}
.chain tr.grp td{padding-top:26px;border-bottom:0}
.chain tr.grp .g{font:500 var(--t-label)/1 var(--font-mono);letter-spacing:var(--ls-label);
  text-transform:uppercase;color:var(--fg-muted)}
.chain tr.sub td{background:var(--bg-sunken);font-weight:600}
.chain tr.tot td{border-top:var(--bw-thick) solid var(--line-solid);border-bottom:0;
  padding-top:var(--s-4);font-weight:700}
.chain tr.tot td:not(.op):not(.amt){font-family:var(--font-display);font-stretch:var(--wdth);
  font-size:1.0625rem}
.chain tr.tot .amt{font-family:var(--font-display);font-stretch:var(--wdth);font-size:1.5rem;
  font-weight:800;letter-spacing:var(--ls-display)}
.chainhint{display:flex;align-items:center;gap:8px;margin:0 0 var(--s-4);
  font-size:var(--t-xs);color:var(--fg-muted)}
/* il segno «i»: un quadrato, non un cerchio — qui non si arrotonda niente */
.idot{display:inline-grid;place-items:center;width:16px;height:16px;flex:none;
  border:var(--bw) solid var(--line-strong);background:var(--bg);
  font:500 10px/1 var(--font-mono);color:var(--fg-muted)}
.chain tr.cl:hover .idot,.chain tr.on .idot{background:var(--c-graphite);color:var(--c-fog);
  border-color:var(--c-graphite)}
.pane{position:sticky;top:88px;border:var(--bw) solid var(--line-strong);
  background:var(--bg-raised);padding:var(--s-5)}
.pane h4{margin:0 0 var(--s-1)}
.pane code{display:block;background:var(--c-graphite);color:var(--c-fog);
  padding:11px 13px;font:400 var(--t-xs)/1.6 var(--font-mono);margin:var(--s-3) 0;
  white-space:pre-wrap}
.pane .empty{color:var(--fg-muted);font-size:var(--t-sm)}
@media(max-width:860px){.detsplit{grid-template-columns:1fr}.pane{position:static}}

/* --- uovo di pasqua: stessa grammatica, angoli tagliati ------------------- */
.egg-modal{--ch:var(--ch-xl);border:var(--bw-thick) solid var(--c-graphite);padding:0;
  max-width:760px;width:calc(100% - 32px);min-height:390px;overflow:hidden;
  background:var(--c-bone);color:var(--c-graphite);
  clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
.egg-modal::backdrop{background:#1e1c2bcc}
.egg-modal::before{content:"€";position:absolute;right:-30px;bottom:-118px;
  font:800 420px/1 var(--font-display);font-stretch:var(--wdth);color:var(--c-flux);
  transform:rotate(-12deg);z-index:0}
.egg-modal::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0);
  background-size:24px 24px}
.egg-modal p{position:relative;z-index:1;max-width:15ch;margin:0;padding:74px 58px 150px;
  font-family:var(--font-display);font-weight:800;font-stretch:var(--wdth);
  font-size:clamp(36px,6vw,62px);line-height:1.02;letter-spacing:var(--ls-display);text-wrap:balance}
@media(max-width:600px){.egg-modal{min-height:420px}.egg-modal p{padding:54px 28px 170px;
  font-size:42px}.egg-modal::before{font-size:330px;right:-50px;bottom:-95px}}

.calc-footer{padding:var(--s-10) var(--s-4) var(--s-12);text-align:center;
  border-top:var(--bw) solid var(--line-strong);
  font:400 var(--t-xs)/1.6 var(--font-mono);color:var(--fg-muted)}

/* --- rifiniture ------------------------------------------------------------ */
.xs{font-size:var(--t-xs)}
.recon{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;
  font-variant-numeric:tabular-nums}
.sec a,.pane a,.voce a{text-decoration:underline;text-decoration-color:var(--line-strong);
  text-decoration-thickness:1px;text-underline-offset:3px}
.sec a:hover,.pane a:hover,.voce a:hover{text-decoration-color:var(--c-flux);
  text-decoration-thickness:2px}
@media(max-width:900px){.form-grid,.geo-grid{grid-template-columns:1fr}}
@media(max-width:600px){
  .anchorbar .mini{display:none}
  .anchors{flex-wrap:nowrap;overflow-x:auto}
}
</style>
</head>

<div id="app"></div>
<script src="dati-addizionali-2026.js"></script>
<script src="geografia.js"></script>
<script src="motore.js"></script>
<script src="fonti.js"></script>
<script src="righe.js"></script>
<script>



/* ============================================================
   DATI — una sola sorgente contenutistica, riusata ovunque
   ============================================================ */
const LIMITI=[
  ['Il 9,19% è una scelta di modello','Non è l\'aliquota di ogni impiegato privato: inquadramento INPS, settore, dimensione del datore e fondi speciali possono cambiarla. Qui si assume FPLD ordinario, senza contribuzioni settoriali.'],
  ['«RAL» non è una base legale autonoma','È una convenzione retributiva. Il calcolo assume RAL = imponibile previdenziale = imponibile fiscale prima dei contributi, senza componenti variabili, benefit o rimborsi.'],
  ['Competenza, non cassa','È il carico maturato sulla RAL 2026, non il denaro trattenuto nei cedolini del 2026: le addizionali si pagano a rate dopo il conguaglio. Per questo la cifra mensile è una media, non l\'importo di una busta paga.'],
  ['Sopra 122.295 € si assume la prima iscrizione dal 1996','Il massimale contributivo vale solo per chi è privo di anzianità al 31/12/1995. È l\'unico punto in cui la sola RAL non basta più.'],
  ['Le detrazioni di famiglia valgono per l\'anno intero','L\'art. 12 c. 3 le rapporta a mese: qui si assume che le condizioni valgano per tutti i dodici. La quota degli ascendenti è assunta intera e non ripartita con altri aventi diritto, e il reddito complessivo del dichiarante è approssimato con l\'imponibile IRPEF. Restano fuori le maggiorazioni per figli con disabilità (art. 12 c. 1 lett. c) e il caso dei familiari residenti all\'estero di contribuente extra-UE (art. 12 c. 2-bis).'],
];
const FAQ=[
  ['Perché il netto mensile non coincide con la mia busta paga?','Il calcolo è annuale e di competenza. Le addizionali vengono trattenute a rate nell\'anno successivo al conguaglio, la tredicesima non beneficia delle stesse detrazioni mensili e il conguaglio di fine anno riequilibra tutto. Per questo il numero è etichettato <b>media</b>, mai «importo del cedolino».'],
  ['Perché scegliere 12, 13 o 14 mensilità non cambia il netto annuo?','Perché non è un dato di calcolo: è solo il divisore con cui si presenta lo stesso netto annuo. Le trattenute non cambiano. Puoi verificarlo qui sopra — cambiando il selettore il netto annuo resta identico e si muove solo la media. Se cambiasse, sarebbe un errore.'],
  ['Perché a volte un euro lordo in più fa <em>scendere</em> il netto?',stato=>{
    const geo=GEOGRAFIA_ITALIA.risolvi(stato.comune);
    const comunali=nucleo=>soglie({comune:stato.comune,nucleo}).filter(s=>s.ambito==='comunale');
    const locali=comunali(stato.nucleo);
    if(!locali.length){
      /* Un salto che c'è per un contribuente solo può non esserci
         per una famiglia: se le detrazioni azzerano l'IRPEF netta
         da entrambi i lati della soglia, non c'è addizionale da
         perdere. Dirlo è diverso dal dire che il comune non ha
         esenzione, e la pagina non deve confondere le due cose. */
      const senzaNucleo=comunali([]);
      if(stato.nucleo.length&&senzaNucleo.length)
        return `Alcune misure locali sono esenzioni con soglia secca, non franchigie. Per ${esc(geo.comune.nome)} il salto esiste — alla RAL di ${eur(senzaNucleo[0].ral)} vale ${eur(Math.abs(senzaNucleo[0].delta))} — ma <b>non per te</b>: con i familiari a carico che hai dichiarato le detrazioni azzerano l’IRPEF netta da entrambi i lati della soglia, e senza IRPEF netta non c’è addizionale da perdere.`;
      return `Alcune misure sono esenzioni con soglia secca, non franchigie. Per ${esc(geo.comune.nome)} lo snapshot non contiene una discontinuità comunale generale; restano le soglie nazionali e le eventuali soglie regionali.`;
    }
    const s=locali[0];
    return `Perché alcune misure locali sono esenzioni con soglia secca, non franchigie: superata la soglia si perdono per intero. Per ${esc(geo.comune.nome)}, alla RAL di ${eur(s.ral)}, il salto dell’addizionale comunale vale ${eur(Math.abs(s.delta))} sul netto annuo.`;
  }],
  ['Quali sono i contributi a carico del dipendente?','Il contributo IVS del 9,19% sull\'imponibile previdenziale, più un contributo aggiuntivo dell\'1% sulla quota che supera la prima fascia pensionabile (56.224 € nel 2026). Sopra il massimale di 122.295 € entrambi si fermano: è il motivo per cui l\'aliquota contributiva effettiva scende oltre quella soglia.'],

/* ============================================================
   NUCLEO FAMILIARE — una riga per familiare. L'età è il dato che
   decide, quindi è una colonna, non un dettaglio nascosto; e la
   colonna «perché» dice sempre come va a finire, anche quando la
   detrazione è zero.
   ============================================================ */
const TIPO_LETTERA={coniuge:'c',figlio:'f',ascendente:'a'};
const LETTERA_TIPO={c:'coniuge',f:'figlio',a:'ascendente'};
const NOME_FAMILIARE={coniuge:'Coniuge',figlio:'Figlio',ascendente:'Ascendente convivente'};
const MAX_FAMILIARI=12;
const serializzaNucleo=nucleo=>nucleo.map(f=>TIPO_LETTERA[f.tipo]+
  (f.eta===null||f.eta===undefined?'':f.eta)+(f.reddito>0?'r'+f.reddito:'')).join('.');
function deserializzaNucleo(testo){
  let coniugi=0;
  return String(testo||'').split('.').map(t=>{
    const m=/^([cfa])(\d{1,3})?(?:r(\d{1,7}))?$/.exec(t);
    if(!m)return null;
    const tipo=LETTERA_TIPO[m[1]];
    if(tipo==='coniuge'&&++coniugi>1)return null;   // l'art. 12 ne conosce uno solo
    return{tipo,eta:m[2]===undefined?null:Number(m[2]),reddito:m[3]?Number(m[3]):0};
  }).filter(Boolean).slice(0,MAX_FAMILIARI);
}

const NUCLEO_LIMITI=`<b>Quando un familiare è «a carico».</b>
  Se il suo reddito supera <b>2.840,51 €</b> non è a carico e la detrazione non spetta;
  per i figli fino a 24 anni il limite è <b>4.000 €</b>.
  <b>Sotto i 21 anni</b> la detrazione per figli non esiste: dal 2022 è assorbita
  dall’<b>Assegno Unico</b>, che si chiede all’INPS e non passa dalla busta paga.
  Riprende dai 21 anni compiuti e si ferma ai 30. Gli <b>altri familiari</b> dell’art. 12
  sono oggi i soli <b>ascendenti conviventi</b> — genitori e nonni che vivono con te.
  Come le altre, queste detrazioni <b>abbattono l’IRPEF e non vengono rimborsate</b>:
  se l’imposta finisce, la parte eccedente si perde.`;
const NUCLEO_PERIMETRO=`<b>Fuori perimetro, dichiarato.</b> Non sono calcolate le
  <b>maggiorazioni per figli con disabilità</b> (art. 12 c. 1 lett. c) né il caso dei
  <b>familiari residenti all’estero di contribuente extra-UE</b> (art. 12 c. 2-bis):
  servono documenti che la sola RAL non porta. Il <b>reddito complessivo</b> del
  dichiarante è approssimato con l’imponibile IRPEF, le detrazioni sono calcolate per
  l’<b>anno intero</b> (l’art. 12 c. 3 le rapporta a mese) e la quota degli ascendenti
  è assunta <b>intera</b>, non ripartita con altri aventi diritto.`;

function nucleoBlocco(stato){
  /* I numeri si mostrano solo se il risultato a schermo è stato
     calcolato per QUESTO nucleo: altrimenti la tabella direbbe una
     cifra e la catena un'altra. */
  const combacia=stato.res&&serializzaNucleo(stato.nucleo)===stato.nucleoCalcolato;
  const voci=combacia?stato.res.voci.filter(v=>/^detrfam\d+$/.test(v.id)):[];
  const righe=combacia?componiRighe(stato.res.voci).filter(r=>/^detrfam\d+$/.test(r.id)):[];
  const cella=(f,i)=>{
    const voce=voci[i],riga=righe[i];
    if(!voce)return['<span class="muted">—</span>','<span class="muted">premi Calcola</span>'];
    return[eur(voce.importo),
      esc(riga.nota)+(voce.capiente?'':' · <b>capienza esaurita</b>')];
  };
  const riga=(f,i)=>{
    const[importo,perche]=cella(f,i);
    return `<tr>
      <td data-etichetta="Familiare"><select class="select nucleo-in" data-nucleo-tipo="${i}"
          aria-label="Tipo di familiare, riga ${i+1}">
        ${Object.entries(NOME_FAMILIARE).map(([k,n])=>
          `<option value="${k}" ${f.tipo===k?'selected':''}>${esc(n)}</option>`).join('')}
      </select></td>
      <td data-etichetta="Età">${f.tipo==='figlio'
        ?`<input class="input nucleo-in nucleo-eta" id="nucleo-eta-${i}" data-nucleo-eta="${i}"
            type="text" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="anni"
            aria-label="Età del figlio, riga ${i+1}" value="${f.eta===null?'':f.eta}">`
        :'<span class="muted">non rileva</span>'}</td>
      <td data-etichetta="Suo reddito"><input class="input nucleo-in nucleo-red" id="nucleo-reddito-${i}" data-nucleo-reddito="${i}"
          type="text" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="0"
          aria-label="Reddito del familiare, riga ${i+1}" value="${f.reddito>0?f.reddito:''}"></td>
      <td class="num nucleo-imp" data-etichetta="Detrazione">${importo}</td>
      <td class="nucleo-perche" data-etichetta="Perché">${perche}</td>
      <td><button class="nucleo-x" data-nucleo-rimuovi="${i}"
        aria-label="Togli il familiare della riga ${i+1}">✕</button></td>
    </tr>`;
  };
  return `<div class="nucleo">
    <div class="nucleo-head">
      <span class="label">Nucleo familiare</span>
      <span class="xs muted">Facoltativo — abbatte l’IRPEF, non i contributi</span>
    </div>
    ${stato.nucleo.length?`<div class="table-wrap"><table class="table nucleo-tab">
      <caption class="sr">Familiari a carico dichiarati</caption>
      <thead><tr><th>Familiare</th><th>Età</th><th>Suo reddito</th>
        <th class="num">Detrazione</th><th>Perché</th><th><span class="sr">Azioni</span></th></tr></thead>
      <tbody>${stato.nucleo.map(riga).join('')}</tbody></table></div>`
      :`<p class="nucleo-vuoto">Nessun familiare dichiarato: il risultato è quello di un
         contribuente senza carichi di famiglia. Per i figli conta l’<b>età</b>, non il numero.</p>`}
    <div class="nucleo-azioni">
      <button class="btn btn--ghost btn--sm" id="nucleo-aggiungi"
        ${stato.nucleo.length>=MAX_FAMILIARI?'disabled':''}>+ Aggiungi familiare</button>
    </div>
    <div class="callout callout--info nucleo-nota">
      <span class="callout__mark">Regola</span><div>${NUCLEO_LIMITI}</div></div>
    <div class="callout callout--warn nucleo-nota">
      <span class="callout__mark">Limite</span><div>${NUCLEO_PERIMETRO}</div></div>
  </div>`;
}

function stackbar(res){

/* ---- flusso del denaro ---- */
function sankey(res,h,fs){
  const ral=res.input.ral,co=res.kpi.totaleContributi,im=res.imponibile,
        tx=res.kpi.totaleImposte,ne=res.kpi.nettoAnnuo,ig=res.integrazioni;
  if(ral<=0)return '<p class="small muted">Nessun flusso da mostrare.</p>';
  const H=h||260,W=780,NW=12,GAP=28,top=36,tot=ral+ig,sc=(H-top-16)/tot,FS=fs||13;
  const x1=6,x2=384,x3=W-NW-6;
  const hRal=ral*sc,hIg=ig*sc,hCo=co*sc,hIm=im*sc,hTx=tx*sc,hNe=ne*sc;
  const yRal=top,yIg=top+hRal+GAP,yCo=top,yIm=top+hCo+GAP,yTx=top,yNe=top+hTx+GAP;
  /* Sul fondo inchiostro i pastelli vanno tenuti alti: sotto il .4
     si impastano nel grafite e il diagramma diventa monocromo. */
  const rib=(xa,ya1,ya2,xb,yb1,yb2,col,op)=>{const m=(xa+xb)/2;
    return `<path d="M${xa},${ya1} C${m},${ya1} ${m},${yb1} ${xb},${yb1} L${xb},${yb2} C${m},${yb2} ${m},${ya2} ${xa},${ya2} Z" fill="${col}" opacity="${op||.55}"/>`;};
  // rx=0: in questo sistema gli angoli non si arrotondano mai.
  const node=(x,y,hh,col)=>`<rect x="${x}" y="${y}" width="${NW}" height="${Math.max(hh,2)}" fill="${col}"/>`;
  const lab=(x,y,t,v,a)=>`<text x="${x}" y="${y-18}" text-anchor="${a}">${esc(t)}</text>
    <text class="n" x="${x}" y="${y-3}" text-anchor="${a}">${eur(v)}</text>`;
  const band=(id,inner,al)=>`<g class="band" tabindex="0" role="button" data-band="${id}" aria-label="${esc(al)}">${inner}</g>`;
  return `<svg class="flowsvg" viewBox="0 0 ${W} ${H}" style="font-size:${FS}px" role="img"
      aria-label="Dalla RAL di ${eur(ral)} a un netto di ${eur(ne)}"><title>Dove va la RAL</title>
    ${band('contributi',rib(x1+NW,yRal,yRal+hCo,x2,yCo,yCo+hCo,C.contrib)+node(x2,yCo,hCo,C.contrib),`Contributi ${eur(co)}`)}
    ${rib(x1+NW,yRal+hCo,yRal+hRal,x2,yIm,yIm+hIm,'var(--c-fog)',.16)}
    ${band('imposte',rib(x2+NW,yIm,yIm+hTx,x3,yTx,yTx+hTx,C.tax)+node(x3,yTx,hTx,C.tax),`Imposte ${eur(tx)}`)}
    ${band('netto',rib(x2+NW,yIm+hTx,yIm+hIm,x3,yNe,yNe+(hIm-hTx),C.netto)+node(x3,yNe,hNe,C.netto),`Netto ${eur(ne)}`)}
    ${ig>0?band('integrazioni',rib(x1+NW,yIg,yIg+hIg,x3,yNe+(hIm-hTx),yNe+hNe,C.integr)+node(x1,yIg,hIg,C.integr),`Integrazioni ${eur(ig)}`):''}
    ${node(x1,yRal,hRal,'var(--c-fog)')}
    ${node(x2,yIm,hIm,'var(--c-fog)')}
    ${lab(x1,yRal,'RAL',ral,'start')}
    ${ig>0?lab(x1,yIg,'Integrazioni di legge',ig,'start'):''}
    ${lab(x2,yCo,'Contributi',co,'start')}
    ${lab(x2,yIm,'Imponibile IRPEF',im,'start')}
    ${lab(x3+NW,yTx,'Imposte',tx,'end')}
    ${lab(x3+NW,yNe,'Netto annuo',ne,'end')}
  </svg>
  <p class="sr">Equivalente testuale: RAL ${eur(ral)}, meno contributi ${eur(co)}, imponibile ${eur(im)},
    meno imposte ${eur(tx)}${ig>0?`, più integrazioni di legge ${eur(ig)}`:''}, netto annuo ${eur(ne)}.</p>`;
}

/* ---- dettaglio: catena a operatori firmati + pannello della voce scelta ---- */
function chain(res,st){
  const v=id=>res.voci.find(x=>x.id===id);
  const righe=componiRighe(res.voci);
  const r=id=>righe.find(x=>x.id===id);
  const rows=[];
  const grp=t=>rows.push(`<tr class="grp"><td></td><td colspan="2" class="g">${t}</td></tr>`);
  const row=(op,label,val,voce,cls='')=>{
    const on=voce&&st.aperta===voce.id;
    const nm=voce
      ? `<button class="lbl" aria-expanded="${!!on}" aria-controls="voce-pane">${esc(label)}
           <span class="idot" aria-hidden="true">i</span></button>`
      : esc(label);
    rows.push(`<tr class="${cls}${voce?' cl':''}${on?' on':''}"
      ${voce?`data-voce="${voce.id}"`:''}><td class="op">${op}</td><td>${nm}</td>
      <td class="amt">${eur(Math.abs(val))}</td></tr>`);
  };
  const rigaVoce=(op,id)=>{const x=v(id),rx=r(id);if(x)row(op,rx.titolo,x.importo,x);};
  grp('Dalla RAL all\'imponibile');
  row('','RAL',res.input.ral,null);
  rigaVoce('−','ivs');
  rigaVoce('−','ecc');
  row('=','Imponibile IRPEF',res.imponibile,null,'sub');
  grp('IRPEF');
  rigaVoce('−','lorda');
  rigaVoce('+','detrlav');
  rigaVoce('+','detrult');
  /* Una riga per familiare, dentro il gruppo IRPEF e non in un
     gruppo suo: sono detrazioni dell'imposta, e staccarle
     lascerebbe «IRPEF netta» orfana del suo blocco. */
  for(const v of res.voci.filter(x=>/^detrfam\d+$/.test(x.id)))row('+',r(v.id).titolo,v.importo,v);
  row('=','IRPEF netta',res.irpefNetta,null,'sub');
  grp('Addizionali locali');
  rigaVoce('−','addreg');
  rigaVoce('−','addcom');
  if(v('somma')||v('ti')){grp('Integrazioni di legge');
    rigaVoce('+','somma');
    rigaVoce('+','ti');}
  rows.push(`<tr class="tot"><td class="op">=</td><td>Netto annuo</td>
    <td class="amt">${eur(res.kpi.nettoAnnuo)}</td></tr>`);
  const sel=st.aperta?res.voci.find(x=>x.id===st.aperta):null;
  const rigaSel=sel?r(sel.id):null;
  const pane=sel?(()=>{const fonte=rigaSel.fonte;
    return `<h4>${esc(rigaSel.titolo)}</h4>
      <div class="xs mono muted">${esc(sel.tipo)} · base ${eur(sel.base)}</div>
      <code>${esc(rigaSel.formula)}</code>
      <div class="small"><b>${eur(Math.abs(sel.importo))}</b></div>
      <hr class="rule" style="margin:16px 0">
      <div class="label">Fonte</div>
      <a class="small" href="${fonte.url}" target="_blank" rel="noopener">${esc(fonte.titolo)}</a>
      <div class="xs muted" style="margin-top:4px">${esc(fonte.descrizione)}</div>`;})()
    :`<div class="empty"><b>Nessuna voce selezionata.</b><br>
       Clicca una riga della catena — quelle con il segno <span class="idot" aria-hidden="true">i</span> —
       per vederne formula, base di calcolo e fonte normativa.</div>`;
  return `<div class="detsplit">
    <div>
      <p class="chainhint"><span class="idot" aria-hidden="true">i</span>
        Le righe con questo segno si aprono: <b>clicca una voce</b> per vederne formula, base e fonte.</p>
      <div class="chainwrap"><table class="chain"><caption class="sr">Dalla RAL al netto annuo</caption>
      <tbody>${rows.join('')}</tbody></table></div>
    </div>
    <aside class="pane" id="voce-pane">${pane}</aside>
  </div>`;
}

function avvisoMassimale(res){
  if(res.input.ral<=122295)return '';
  return `<div class="callout callout--warn limit-note">
    <span class="callout__mark">Limite</span>
    <div><b>Oltre 122.295 € la sola RAL non basta.</b>
    Il risultato applica il massimale contributivo assumendo che il dipendente non avesse
    anzianità contributiva al 31 dicembre 1995. Se questa condizione non vale, il risultato
    non è applicabile.</div></div>`;
}
function metodo(stato=st){
  const geo=GEOGRAFIA_ITALIA.risolvi(stato.comune);
  const fontiMetodo=[...Object.values(FONTI).slice(0,7),
    ['Istat — comuni italiani',`${geo.meta.istat.comuni} comuni attivi dal ${geo.meta.istat.vigenteDal}`,geo.meta.istat.url],
    ['MEF — addizionale regionale',`Regola 2026 per ${geo.regione.nome}`,geo.regionale.fonte.url],
    ['MEF — addizionale comunale',`Regola ${geo.comunale.fonte.annoOrigine} per ${geo.comune.nome}, ${geo.comunale.fonte.stato}`,geo.comunale.fonte.url]];
  return `<div class="stack" style="gap:34px">
    <div>
      <h3 style="margin:0 0 10px">L'ordine delle operazioni</h3>
      <p class="small muted" style="margin:0;max-width:74ch">
      Tredici passi in ordine vincolante: contributi, imponibile, IRPEF lorda per scaglioni, detrazioni,
      IRPEF netta, addizionali — dovute solo se l'IRPEF netta è positiva — e integrazioni di legge.
      Aritmetica decimale al centesimo, mai in virgola mobile binaria; il netto è definito come la somma
      delle voci arrotondate, così la tabella chiude sempre per costruzione.
      Versione delle regole: <span class="tag">regole-2026-v2</span></p>
    </div>
    <div>
      <h3 style="margin:0 0 14px">Cifre chiave 2026</h3>
      ${cifreChiave()}
    </div>
    <div>
      <h3 style="margin:0 0 14px">Fonti</h3>
      <div class="voci">
        ${fontiMetodo.map(([t,d,u])=>`<div class="voce">
          <a class="small" style="font-weight:600" href="${u}" target="_blank" rel="noopener">${esc(t)}</a>
          <div class="xs muted" style="margin-top:4px">${esc(d)}</div></div>`).join('')}
      </div>
    </div>
    <div>
      <h3 style="margin:0 0 10px">Come è verificato</h3>
      <p class="small muted" style="margin:0 0 12px;max-width:74ch">
      Due controlli, di natura diversa. <b>A ogni ricalcolo</b> la pagina verifica che la somma
      delle voci sia il netto annuo: il netto non è un totale calcolato a parte e poi confrontato,
      è quella somma. Una tabella che non chiude non può comparire a schermo.
      <b>Fuori dalla pagina</b> gira una matrice di prove sul motore, in quattro categorie tenute
      distinte perché provano cose diverse: poche ancore confrontate a mano con la norma
      (la catena completa a 35.000 €, il massimale, la fine dell'esenzione comunale, la capienza
      delle detrazioni), le soglie nazionali e locali del comune selezionato e i cambi di pendenza presi a un centesimo di
      distanza, una rete di regressione a passo di 100 € da 0 a 200.000 €, e ogni voce del calcolo
      esercitata da sola.</p>
      <p class="small muted" style="margin:0;max-width:74ch">
      Cosa <b>non</b> è provato conta quanto il resto: nessun consulente del lavoro ha validato
      questi numeri, e la riconciliazione da sola non prova la correttezza — conferma un'identità
      algebrica, e resterebbe verde anche con le aliquote sbagliate. L'elenco completo di ciò che
      è provato e di ciò che non lo è sta nel repository, in
      <span class="tag">processo/verifica.md</span>.</p>
    </div>
    <div>
      <h3 style="margin:0 0 6px">Limiti dichiarati</h3>
      <p class="small muted" style="margin:0 0 14px">Cinque, in chiaro. Uno strumento onesto dichiara dove smette di valere.</p>
      <div class="accordion">${LIMITI.map(([t,b])=>`<details><summary><span>${esc(t)}</span></summary>
        <div class="acc-body">${esc(b)}</div>
      </details>`).join('')}</div>
    </div>
  </div>`;
}
function faq(stato=st){
  return `<div class="accordion">${FAQ.map(([q,a])=>`<details><summary><span>${q}</span></summary>
    <div class="acc-body">${typeof a==='function'?a(stato):a}</div>
  </details>`).join('')}</div>`;
}

/* ============================================================
   LE SEZIONI — stesso contenuto, tre organizzazioni diverse
   ============================================================ */
function sezioni(res,st){
  return [
    {id:'risultato',eye:'Livello 1 — la risposta',t:'Quanto ti resta',
     lede:'Il netto annuo maturato sulla RAL inserita, e la sua media per mensilità.',
     body:`${answerBlock(res)}<div style="margin-top:var(--s-8)">${kpis(res)}</div>
       ${avvisoMassimale(res)}`},
    {id:'flusso',ink:true,eye:'Livello 2 — il flusso',t:'Dove va il resto',
     lede:'Le fasce sono in scala: la larghezza di ogni flusso è proporzionale al suo importo. Si parte dalla RAL, non dal costo azienda: questo strumento risponde a «dove vanno i soldi trattenuti sul mio lordo», non a quanto costi all\'azienda. Clicca una fascia per aprirne le voci.',
     body:`${sankey(res,260,12)}<div class="legend" style="margin-top:var(--s-8)">${legendItems(res)}</div>`},
    {id:'dettaglio',eye:'Livello 3 — il dettaglio',t:'Ogni euro, voce per voce',
     lede:'La catena completa, con gli operatori in chiaro. Ogni riga contrassegnata si apre: cliccala e la spiegazione compare qui a fianco.',
     body:chain(res,st)},
    {id:'metodo',eye:'Metodo',t:'Come è costruito il calcolo',
     lede:'Le regole nazionali e locali applicate sono dichiarate e collegate alla fonte ufficiale.',
     body:metodo()},
    {id:'faq',eye:'Domande frequenti',t:'Le domande che arrivano sempre',
     lede:'',body:faq()},
  ];
}
const anchorsHTML=st=>`<nav class="anchors" aria-label="Sezioni del risultato">
  ${SEZIONI.map(([id,l])=>`<a href="#${id}" data-anchor="${id}"
     aria-current="${st.attiva===id}">${l}</a>`).join('')}</nav>`;

/* ---- la pagina del risultato: barra di ancore appiccicosa,
       sezioni a fasce alternate ---- */
function pagina(res,st){
  const secs=sezioni(res,st);
  /* Una sola sezione inchiostro per pagina: è tutto il budget di
     contrasto del sistema, e il flusso del denaro è il punto dove
     serve — il diagramma legge come un disegno tecnico. */
  const sez=(s,i)=>`<section class="sec${s.ink?' sec--ink on-ink':''}" id="${s.id}">
      <div class="pg">
        <span class="no">§ ${String(i+1).padStart(2,'0')}</span>
        <div class="eyebrow">${s.eye}</div>
        <div class="sec-head"><h2>${s.t}</h2>${s.tool||''}</div>
        ${s.lede?`<p class="lead">${s.lede}</p>`:''}
        <div class="sec-body">${s.body}</div>
      </div></section>`;
  return `${hero(st)}<div class="pg">${form(st)}</div>
    <div class="anchorbar" style="margin-top:clamp(32px,4vw,56px)"><div class="pg"><div class="inner">
      ${anchorsHTML(st)}
      <div class="mini"><span>Netto annuo</span>
        <b>${eur(res.kpi.nettoAnnuo)}</b></div>
    </div></div></div>
    ${secs.map(sez).join('')}
    <footer class="calc-footer">Prototipo di Riccardo Sartori per il task AI Builder @ Jet HR.</footer>
    ${eggDialog()}`;
}
const eggDialog=()=>`<dialog class="egg-modal" id="egg"><p>Questa non è più una RAL.<br>È un pre-seed!</p></dialog>`;
function vuoto(st){
  return `${hero(st)}<div class="pg">${form(st)}
    <section class="sec">
      <span class="no">§ 01</span>
      <div class="eyebrow">Prima di calcolare</div>
      <h2>Cifre chiave 2026</h2>
      <p class="lead">Le regole nazionali e locali che il calcolo applica.</p>
      <div class="sec-body">${cifreChiave(st)}</div>
    </section>
    <section class="sec" style="border-bottom:0">
      <span class="no">§ 02</span>
      <div class="eyebrow">Domande frequenti</div>
      <h2>Le domande che arrivano sempre</h2>
      <div class="sec-body">${faq()}</div>
    </section>
  </div>
  <footer class="calc-footer">Prototipo di Riccardo Sartori per il task AI Builder @ Jet HR.</footer>
  ${eggDialog()}`;
}

/* ============================================================
   STATO E EVENTI
   ============================================================ */
const GEO_DEFAULT=GEOGRAFIA_ITALIA.risolvi('F205');
const st={ralRaw:'35.000',mensilita:13,regione:GEO_DEFAULT.provincia.regione,
  provincia:GEO_DEFAULT.comune.provincia,comune:GEO_DEFAULT.comune.catastale,
  nucleo:[],nucleoCalcolato:null,
  aperta:null,attiva:'risultato',res:null,errore:null,dirty:false,eggPending:false};

function fromURL(){
  const p=new URLSearchParams(location.search);
  if(p.get('c')){try{const g=GEOGRAFIA_ITALIA.risolvi(p.get('c'));
    st.regione=g.provincia.regione;st.provincia=g.comune.provincia;st.comune=g.comune.catastale;}catch{}}
  if(p.get('ral'))st.ralRaw=p.get('ral');
  if(p.get('n'))st.nucleo=deserializzaNucleo(p.get('n'));
  const mensilita=Number(p.get('m'));
  if(MENSILITA_AMMESSE.includes(mensilita))st.mensilita=mensilita;
  if(p.get('calc')==='1')commit(true);
}
function toURL(){
  const p=new URLSearchParams();
  p.set('ral',st.ralRaw);p.set('m',String(st.mensilita));p.set('c',st.comune);
  /* Senza familiari dichiarati la query string resta quella di
     prima: la funzione è additiva anche nell'URL. */
  const nucleo=serializzaNucleo(st.nucleo);
  if(nucleo)p.set('n',nucleo);
  if(st.res)p.set('calc','1');
  history.replaceState(null,'','?'+p.toString()+(st.res?'#risultato':''));
}
function scrollAlRisultato(){
  document.getElementById('risultato')?.scrollIntoView({
    behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
}
function commit(silenzioso){
  st.errore=null;
  const v=parseRal(st.ralRaw);
  if(v===null){st.errore='Inserisci la RAL per calcolare.';st.res=null;}
  else if(Number.isNaN(v)){st.errore='Solo cifre: usa la virgola per i decimali, per esempio 35.000,50.';st.res=null;}
  else if(Number(v)<0){st.errore='La RAL non può essere negativa.';st.res=null;}
  else if(Number(v)===4700000){st.res=null;st.dirty=false;st.eggPending=true;}
  else if(Number(v)>1000000){st.errore='Il calcolo è disponibile fino a una RAL di 1.000.000 €.';st.res=null;}
  else{st.res=applicaMensilita(calcola(v,{comune:st.comune,nucleo:st.nucleo}),st.mensilita);
    st.nucleoCalcolato=serializzaNucleo(st.nucleo);st.dirty=false;st.eggPending=false;
    if(!st.aperta)st.aperta='ivs';}   // mostra subito a cosa serve il pannello
  if(!silenzioso){
    render();
    if(st.res)scrollAlRisultato();
  }
}
/* Prima di ridisegnare annoto CHI aveva il fuoco, in modo da restituirglielo
   dopo. Senza questo, chi usa la tastiera torna a inizio pagina ogni volta
   che apre una voce. */
function segnaFuoco(){
  const a=document.activeElement;
  if(!a||a===document.body)return null;
  const r=a.closest('[data-voce]');
  if(r)return `tr[data-voce="${r.dataset.voce}"] .lbl`;
  const b=a.closest('[data-band]');
  if(b)return `[data-band="${b.dataset.band}"]`;
  const m=a.closest('[data-m]');
  if(m)return `[data-m="${m.dataset.m}"]`;
  const n=a.closest('[data-nucleo-rimuovi]');
  if(n)return `[data-nucleo-rimuovi="${n.dataset.nucleoRimuovi}"]`;
  return a.id?'#'+a.id:null;
}
function rendiFuoco(sel){
  if(!sel)return;
  document.querySelector(sel)?.focus({preventScroll:true});
}
let obs=null;
function scrollspy(){
  if(obs)obs.disconnect();
  const secs=[...document.querySelectorAll('.sec[id]')];
  if(!secs.length)return;
  obs=new IntersectionObserver(es=>{
    const vis=es.filter(e=>e.isIntersecting)
      .sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
    if(!vis)return;
    const id=vis.target.id;
    if(id===st.attiva)return;
    st.attiva=id;
    document.querySelectorAll('[data-anchor]').forEach(a=>
      a.setAttribute('aria-current',String(a.dataset.anchor===id)));
  },{rootMargin:'-96px 0px -55% 0px',threshold:0});
  secs.forEach(s=>obs.observe(s));
}
function render(keepScroll){
  const y=window.scrollY,fuoco=segnaFuoco();
  document.getElementById('app').innerHTML=
    st.res?pagina(st.res,st):vuoto(st);
  if(st.dirty)document.querySelector('.calcrow')?.closest('.calcbox')?.classList.add('is-dirty');
  toURL();scrollspy();
  if(keepScroll)window.scrollTo(0,y);
  rendiFuoco(fuoco);
  const egg=document.getElementById('egg');
  if(egg&&st.eggPending){egg.showModal();st.eggPending=false;}
}
function segnaSporco(campo){
  if(!st.res)return;
  st.dirty=true;
  campo.closest('.calcbox')?.classList.add('is-dirty');
}
document.addEventListener('input',e=>{
  const d=e.target.dataset||{};
  if(e.target.id==='ral'){st.ralRaw=e.target.value;return segnaSporco(e.target);}
  /* Età e reddito non ridisegnano la pagina a ogni cifra: il campo
     resta quello che l'utente sta scrivendo, cursore compreso. */
  if(d.nucleoEta!==undefined){
    const cifre=e.target.value.replace(/\D/g,'').slice(0,3);
    if(cifre!==e.target.value)e.target.value=cifre;
    st.nucleo[Number(d.nucleoEta)].eta=cifre===''?null:Number(cifre);
    return segnaSporco(e.target);
  }
  if(d.nucleoReddito!==undefined){
    const cifre=e.target.value.replace(/\D/g,'').slice(0,7);
    if(cifre!==e.target.value)e.target.value=cifre;
    st.nucleo[Number(d.nucleoReddito)].reddito=cifre===''?0:Number(cifre);
    return segnaSporco(e.target);
  }
});
document.addEventListener('change',e=>{
  const indice=e.target.dataset&&e.target.dataset.nucleoTipo;
  if(indice!==undefined&&indice!==null){
    const familiare=st.nucleo[Number(indice)];
    familiare.tipo=e.target.value;
    if(familiare.tipo!=='figlio')familiare.eta=null;   // l'età non rileva per gli altri
    if(st.res)st.dirty=true;
    return render(true);
  }
  if(!['regione','provincia','comune'].includes(e.target.id))return;
  if(e.target.id==='regione'){
    st.regione=Number(e.target.value);
    const p=GEOGRAFIA_ITALIA.province(st.regione)[0];
    st.provincia=p.id;st.comune=GEOGRAFIA_ITALIA.comuni(p.id)[0].catastale;
  }else if(e.target.id==='provincia'){
    st.provincia=Number(e.target.value);st.comune=GEOGRAFIA_ITALIA.comuni(st.provincia)[0].catastale;
  }else st.comune=e.target.value;
  if(st.res)st.dirty=true;
  render(true);
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='ral'&&e.key==='Enter'){e.preventDefault();commit();}
});
document.addEventListener('click',e=>{
  if(e.target.id==='egg'){e.target.close();return;}
  const a=e.target.closest('[data-anchor]');
  if(a){e.preventDefault();
    document.getElementById(a.dataset.anchor)?.scrollIntoView({
      behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
    return;}
  const familiare=e.target.closest('#nucleo-aggiungi,[data-nucleo-rimuovi]');
  if(familiare){
    if(familiare.id==='nucleo-aggiungi'){
      if(st.nucleo.length>=MAX_FAMILIARI)return;
      st.nucleo.push({tipo:'figlio',eta:null,reddito:0});
    }else st.nucleo.splice(Number(familiare.dataset.nucleoRimuovi),1);
    if(st.res)st.dirty=true;
    return render(true);
  }
  const t=e.target.closest('#go,#reset,[data-m],[data-voce],[data-band]');
  if(!t)return;
  if(t.id==='go')return commit();
  if(t.id==='reset'){st.res=null;st.ralRaw='';st.aperta=null;st.errore=null;
    st.nucleo=[];st.nucleoCalcolato=null;return render();}
  if(t.hasAttribute('data-m')){
    st.mensilita=Number(t.dataset.m);
    // Mensilita' e' presentazione, non calcolo: si divide il netto annuo
    // gia' calcolato, senza richiamare il motore.
    if(st.res)st.res=applicaMensilita(st.res,st.mensilita);
    return render(true);}
  if(t.hasAttribute('data-voce')){
    st.aperta=st.aperta===t.dataset.voce?null:t.dataset.voce;return render(true);}
  if(t.hasAttribute('data-band')){
    // Il netto non e' una voce della catena: e' il totale. La sua fascia porta al
    // dettaglio senza svuotare il pannello, cosi' il clic non sembra fallito.
    const map={contributi:'ivs',imposte:'lorda',integrazioni:'somma'};
    const voce=map[t.dataset.band];
    if(voce)st.aperta=voce;
    render(true);
    document.getElementById('dettaglio')?.scrollIntoView({
      behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
    if(st.aperta)rendiFuoco(`tr[data-voce="${st.aperta}"] .lbl`);
  }
});
document.addEventListener('keydown',e=>{
  const b=e.target.closest('[data-band]');
  // Le fasce del flusso sono elementi SVG: non hanno il metodo click(),
  // quindi da tastiera l'evento va costruito a mano.
  if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();
    b.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
fromURL();render();
if(location.hash==='#risultato'&&st.res)scrollAlRisultato();

</script>

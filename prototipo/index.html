}
function kpis(res,lead){
  const k=res.kpi;
  const cell=(l,v,cls)=>`<div class="${cls||''}"><div class="jet-stat">
    <div class="jet-stat-label">${l}</div><div class="jet-stat-value jet-amount">${v}</div></div></div>`;
  return `<div class="kpigrid">
    ${cell('Netto annuo',eur(k.nettoAnnuo),lead?'kpi-lead':'')}
    ${cell(`Media su ${res.input.mensilita}`,eur(k.mediaMensile))}
    ${cell('Totale imposte',eur(k.totaleImposte))}
    ${cell('Totale contributi',eur(k.totaleContributi))}
    ${cell('Aliquota contributiva',res.aliquotaContributivaEffettiva.toFixed(2).replace('.',',')+'%')}
  </div>`;
}
function answerBlock(res){
  return `<div class="answer">
    <div>
      <div class="jet-stat-label">Netto, media su ${res.input.mensilita} mensilità</div>
      <div class="big">${eur(res.kpi.mediaMensile)}</div>
      <p class="jet-body-s jet-muted" style="margin:10px 0 0">
        Su una RAL di <b>${eur(res.input.ral)}</b> restano <b>${eur(res.kpi.nettoAnnuo)}</b> l'anno.</p>
    </div>
    <div style="flex:1;min-width:260px">
      ${stackbar(res)}
      <div class="legend" style="margin-top:12px">${legendItems(res)}</div>
    </div>
  </div>`;
}
function legendItems(res){
  const it=[[C.contrib,'Contributi'],[C.tax,'Imposte'],[C.netto,'Netto']];
  if(res.integrazioni>0)it.push([C.integr,'Integrazioni di legge']);
  return it.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('');
}
function stackbar(res){
  const ral=res.input.ral;if(ral<=0)return '';
  const p=x=>Math.max(0,x/ral*100);
  const seg=(w,k,t)=>`<div style="width:${w}%;background:${C[k]};color:${CINK[k]}" title="${esc(t)}">${w>13?t:''}</div>`;
  return `<div class="stackbar" role="img" aria-label="Ripartizione della RAL: contributi ${p(res.kpi.totaleContributi).toFixed(1)}%, imposte ${p(res.kpi.totaleImposte).toFixed(1)}%, netto ${p(res.kpi.nettoAnnuo-res.integrazioni).toFixed(1)}%">
    ${seg(p(res.kpi.totaleContributi),'contrib','Contributi')}
    ${seg(p(res.kpi.totaleImposte),'tax','Imposte')}
    ${seg(p(res.kpi.nettoAnnuo-res.integrazioni),'netto','Netto')}
  </div>`;
}

/* ---- flusso del denaro ---- */
function sankey(res,h,fs){
  const ral=res.input.ral,co=res.kpi.totaleContributi,im=res.imponibile,
        tx=res.kpi.totaleImposte,ne=res.kpi.nettoAnnuo,ig=res.integrazioni;
  if(ral<=0)return '<p class="jet-body-s jet-muted">Nessun flusso da mostrare.</p>';
  const H=h||260,W=780,NW=12,GAP=28,top=36,tot=ral+ig,sc=(H-top-16)/tot,FS=fs||13;
  const x1=6,x2=384,x3=W-NW-6;
  const hRal=ral*sc,hIg=ig*sc,hCo=co*sc,hIm=im*sc,hTx=tx*sc,hNe=ne*sc;
  const yRal=top,yIg=top+hRal+GAP,yCo=top,yIm=top+hCo+GAP,yTx=top,yNe=top+hTx+GAP;
  const rib=(xa,ya1,ya2,xb,yb1,yb2,col)=>{const m=(xa+xb)/2;
    return `<path d="M${xa},${ya1} C${m},${ya1} ${m},${yb1} ${xb},${yb1} L${xb},${yb2} C${m},${yb2} ${m},${ya2} ${xa},${ya2} Z" fill="${col}" opacity=".22"/>`;};
  const node=(x,y,hh,col)=>`<rect x="${x}" y="${y}" width="${NW}" height="${Math.max(hh,2)}" rx="2" fill="${col}"/>`;
  const lab=(x,y,t,v,a)=>`<text x="${x}" y="${y-18}" text-anchor="${a}">${esc(t)}</text>
    <text class="n" x="${x}" y="${y-3}" text-anchor="${a}">${eur(v)}</text>`;
  const band=(id,inner,al)=>`<g class="band" tabindex="0" role="button" data-band="${id}" aria-label="${esc(al)}">${inner}</g>`;
  return `<svg class="flowsvg" viewBox="0 0 ${W} ${H}" style="font-size:${FS}px" role="img"
      aria-label="Dalla RAL di ${eur(ral)} a un netto di ${eur(ne)}"><title>Dove va la RAL</title>
    ${band('contributi',rib(x1+NW,yRal,yRal+hCo,x2,yCo,yCo+hCo,C.contrib)+node(x2,yCo,hCo,C.contrib),`Contributi ${eur(co)}`)}
    ${rib(x1+NW,yRal+hCo,yRal+hRal,x2,yIm,yIm+hIm,'var(--_ref---color--gray-scale--200)')}
    ${band('imposte',rib(x2+NW,yIm,yIm+hTx,x3,yTx,yTx+hTx,C.tax)+node(x3,yTx,hTx,C.tax),`Imposte ${eur(tx)}`)}
    ${band('netto',rib(x2+NW,yIm+hTx,yIm+hIm,x3,yNe,yNe+(hIm-hTx),C.netto)+node(x3,yNe,hNe,C.netto),`Netto ${eur(ne)}`)}
    ${ig>0?band('integrazioni',rib(x1+NW,yIg,yIg+hIg,x3,yNe+(hIm-hTx),yNe+hNe,C.integr)+node(x1,yIg,hIg,C.integr),`Integrazioni ${eur(ig)}`):''}
    ${node(x1,yRal,hRal,'var(--jet-black)')}
    ${node(x2,yIm,hIm,'var(--_ref---color--gray-scale--300)')}
    ${lab(x1,yRal,'RAL',ral,'start')}
    ${ig>0?lab(x1,yIg,'Integrazioni di legge',ig,'start'):''}
    ${lab(x2,yCo,'Contributi',co,'start')}
    ${lab(x2,yIm,'Imponibile IRPEF',im,'start')}
    ${lab(x3+NW,yTx,'Imposte',tx,'end')}
    ${lab(x3+NW,yNe,'Netto annuo',ne,'end')}
  </svg>
  <p class="sr">Equivalente testuale: RAL ${eur(ral)}, meno contributi ${eur(co)}, imponibile ${eur(im)},
    meno imposte ${eur(tx)}${ig>0?`, più integrazioni di legge ${eur(ig)}`:''}, netto annuo ${eur(ne)}.</p>`;
}

/* ============================================================
   RIGHE — dal numero alla frase.

   Il motore emette una VOCE: importo, base, tipo, fonte, e i
   numeri che sono entrati nel conto. Titolo e formula nascono
   qui, perché sono disegno e non calcolo — è la distinzione fra
   «voce» e «riga» del glossario in CONTEXT.md.

   Nessun letterale fiscale in questo blocco: soglie e aliquote
   arrivano da `K`, esportata dal motore. Se una soglia cambia,
   cambia in un posto solo e la frase la segue.
   ============================================================ */
/* RIGHE-INIZIO */
/* L'impalcatura sta in inglese, come `fmt`, `eur` e `grp`: serve a
   far funzionare la macchina, non a descrivere una norma. */
const noCents=n=>fmt(n).replace(',00','');
const pct=(n,d)=>(n*100).toFixed(d).replace('.',',')+'%';
const toThousands=b=>toNumber(b)/1000;

/* Capienza: le detrazioni abbattono l'imposta, non sono
   rimborsabili. La nota compare su TUTTE le detrazioni appena una
   di esse non entra intera — è un vincolo sul totale, non su una
   voce sola. */
function capienza(v,voci){
  const detrazioni=voci.filter(x=>x.tipo==='detrazione');
  if(detrazioni.every(x=>x.capiente))return '';
  return `  →  spettante ${fmt(v.spettante)} €,`+
    `  ⚠ capienza: usata ${fmt(v.importo)} € — le detrazioni non sono rimborsabili`;
}

/* Una riga per voce, titolo e formula accanto: aggiungere una voce
   è una sola aggiunta qui, non una in un elenco di titoli più una
   in un ramo di formula. */
const RIGHE={
  ivs:{
    titolo:()=>'Contributi previdenziali IVS',
    formula:v=>`${fmt(v.base)} × ${pct(v.aliquota,2)}`,
  },
  ecc:{
    titolo:v=>`Contributo aggiuntivo ${pct(v.aliquota,0)}`,
    formula:v=>`(${fmt(v.baseContributiva)} − ${fmt(v.soglia)}) × ${pct(v.aliquota,0)}`,
  },
  lorda:{
    titolo:()=>'IRPEF lorda',
    formula:v=>{
      const sc=K.irpef.scaglioni,al=i=>pct(toNumber(sc[i][1]),0);
      return `${al(0)} × min(${fmt(v.base)}; ${noCents(toNumber(sc[0][0]))}) `+
             `+ ${al(1)} sulla quota ${toThousands(sc[0][0])}–${toThousands(sc[1][0])}k `+
             `+ ${al(2)} oltre`;
    },
  },
  detrlav:{
    titolo:v=>'Detrazione lavoro dipendente'+
      (v.maggiorazione>0?` (+${noCents(v.maggiorazione)} €)`:''),
    formula:(v,voci)=>{
      const D=K.detrazioneLavoro;
      let f;
      if(v.base<=toNumber(D.sogliaFissa))
        f=`${fmt(v.quotaFissa)} (fisso fino a ${noCents(toNumber(D.sogliaFissa))} €)`;
      else if(v.base<=toNumber(D.sogliaIntermedia))
        f=`${noCents(v.quotaFissa)} + ${noCents(v.quotaVariabile)} × ${v.rapporto.toFixed(4)}`;
      else if(v.base<=toNumber(D.sogliaFinale))
        f=`${noCents(v.quotaVariabile)} × ${v.rapporto.toFixed(4)}`+
          `  (rapporto troncato a 4 decimali)`;
      else f=`0 (imponibile oltre ${noCents(toNumber(D.sogliaFinale))} €)`;
      if(v.maggiorazione>0)
        f+=`  +${noCents(v.maggiorazione)} (imponibile `+
           `${toThousands(D.maggiorazioneDa)}–${toThousands(D.maggiorazioneA)}k)`;
      return f+capienza(v,voci);
    },
  },
  detrult:{
    titolo:()=>'Ulteriore detrazione',
    formula:(v,voci)=>{
      const U=K.ulterioreDetrazione;
      const f=v.rapporto===null
        ? `${fmt(v.quotaFissa)} (imponibile ${toThousands(U.da)}–${toThousands(U.pienoFinoA)}k)`
        : `${noCents(v.quotaFissa)} × (${noCents(toNumber(U.a))} − ${fmt(v.base)}) `+
          `÷ ${noCents(toNumber(U.ampiezzaDecrescente))}`;
      return f+capienza(v,voci);
    },
  },
  addreg:{
    titolo:()=>'Addizionale regionale Lombardia',
    formula:v=>{
      if(!v.dovuta)return '0 — non dovuta: IRPEF netta è zero';
      const sc=K.regionale.scaglioni;
      return sc.map(([tetto,aliquota],i)=>{
        const al=pct(toNumber(aliquota),2);
        if(tetto===null)return `${al} oltre`;
        return i===0?`${al} fino a ${toThousands(tetto)}k`
                    :`${al} ${toThousands(sc[i-1][0])}–${toThousands(tetto)}k`;
      }).join(' · ');
    },
  },
  addcom:{
    titolo:()=>'Addizionale comunale Milano',
    formula:v=>{
      if(!v.dovuta)return '0 — non dovuta: IRPEF netta è zero';
      const esente=toNumber(K.comunale.esenzioneFinoA);
      return v.base>esente
        ? `${fmt(v.base)} × ${pct(v.aliquota,1)} (sull'intero imponibile)`
        : `0 — esente fino a ${noCents(esente)} € di imponibile`;
    },
  },
  somma:{
    titolo:()=>'Somma non imponibile (cuneo)',
    formula:v=>`${fmt(v.base)} × ${pct(v.aliquota,1)}`,
  },
  ti:{
    titolo:()=>'Trattamento integrativo',
    formula:v=>{
      const T=K.trattamentoIntegrativo;
      return `${fmt(v.quotaFissa)} — imponibile ≤ ${noCents(toNumber(T.limiteImponibile))} `+
             `e IRPEF lorda > detrazione − ${noCents(toNumber(T.scartoDetrazione))}`;
    },
  },
};

const titolo=v=>RIGHE[v.id].titolo(v);
const formula=(v,voci)=>RIGHE[v.id].formula(v,voci);
/* RIGHE-FINE */

/* ---- dettaglio: catena a operatori firmati + pannello della voce scelta ---- */
function chain(res,st){
  const v=id=>res.voci.find(x=>x.id===id);
  const rows=[];
  const grp=t=>rows.push(`<tr class="grp"><td></td><td colspan="2" class="g">${t}</td></tr>`);
  const row=(op,label,val,voce,cls='')=>{
    const on=voce&&st.aperta===voce.id;
    const nm=voce
      ? `<button class="lbl" aria-expanded="${!!on}" aria-controls="voce-pane">${esc(label)}
           <span class="jet-info-dot" aria-hidden="true">i</span></button>`
      : esc(label);
    rows.push(`<tr class="${cls}${voce?' cl':''}${on?' on':''}"
      ${voce?`data-voce="${voce.id}"`:''}><td class="op">${op}</td><td>${nm}</td>
      <td class="amt">${eur(Math.abs(val))}</td></tr>`);
  };
  const rigaVoce=(op,id)=>{const x=v(id);if(x)row(op,titolo(x),x.importo,x);};
  grp('Dalla RAL all\'imponibile');
  row('','RAL',res.input.ral,null);
  rigaVoce('−','ivs');
  rigaVoce('−','ecc');
  row('=','Imponibile IRPEF',res.imponibile,null,'sub');
  grp('IRPEF');
  rigaVoce('−','lorda');
  rigaVoce('+','detrlav');
  rigaVoce('+','detrult');
  row('=','IRPEF netta',res.irpefNetta,null,'sub');
  grp('Addizionali locali');
  rigaVoce('−','addreg');
  rigaVoce('−','addcom');
  if(v('somma')||v('ti')){grp('Integrazioni di legge');
    rigaVoce('+','somma');
    rigaVoce('+','ti');}
  rows.push(`<tr class="tot"><td class="op">=</td><td>Netto annuo</td>
    <td class="amt">${eur(res.kpi.nettoAnnuo)}</td></tr>`);
  const sel=st.aperta?res.voci.find(x=>x.id===st.aperta):null;
  const pane=sel?(()=>{const[t,d,u]=FONTI[sel.fonte];
    return `<h4>${esc(titolo(sel))}</h4>
      <div class="jet-body-s jet-muted" style="margin-bottom:2px">${esc(sel.tipo)} · base ${eur(sel.base)}</div>
      <code>${esc(formula(sel,res.voci)||'—')}</code>
      <div class="jet-body-s"><b>${eur(Math.abs(sel.importo))}</b></div>
      <hr class="jet-divider" style="margin:14px 0">
      <div class="jet-body-xs jet-muted">Fonte</div>
      <a class="jet-body-s" href="${u}" target="_blank" rel="noopener">${esc(t)}</a>
      <div class="jet-body-xs jet-muted" style="margin-top:2px">${esc(d)}</div>`;})()
    :`<div class="empty"><b>Nessuna voce selezionata.</b><br>
       Clicca una riga della catena — quelle con il segno <span class="jet-info-dot" aria-hidden="true">i</span> —
       per vederne formula, base di calcolo e fonte normativa.</div>`;
  return `<div class="detsplit">
    <div>
      <p class="chainhint"><span class="jet-info-dot" aria-hidden="true">i</span>
        Le righe con questo segno si aprono: <b>clicca una voce</b> per vederne formula, base e fonte.</p>
      <div class="chainwrap"><table class="chain"><caption class="sr">Dalla RAL al netto annuo</caption>
      <tbody>${rows.join('')}</tbody></table></div>
    </div>
    <aside class="pane" id="voce-pane">${pane}</aside>
  </div>`;
}

function avvisoMassimale(res){
  if(res.input.ral<=122295)return '';
  return `<div class="limit-note"><b>Oltre 122.295 € la sola RAL non basta.</b>
    Il risultato applica il massimale contributivo assumendo che il dipendente non avesse
    anzianità contributiva al 31 dicembre 1995. Se questa condizione non vale, il risultato
    non è applicabile.</div>`;
}
function metodo(){
  return `<div class="stack" style="gap:26px">
    <div>
      <h3 class="jet-h5" style="margin:0 0 8px">L'ordine delle operazioni</h3>
      <p class="jet-body-s" style="margin:0;color:var(--jet-text-regular);max-width:74ch">
      Tredici passi in ordine vincolante: contributi, imponibile, IRPEF lorda per scaglioni, detrazioni,
      IRPEF netta, addizionali — dovute solo se l'IRPEF netta è positiva — e integrazioni di legge.
      Aritmetica decimale al centesimo, mai in virgola mobile binaria; il netto è definito come la somma
      delle voci arrotondate, così la tabella chiude sempre per costruzione.
      Versione delle regole: <span class="jet-chip jet-chip--mono">regole-2026-v1</span></p>
    </div>
    <div>
      <h3 class="jet-h5" style="margin:0 0 8px">Cifre chiave 2026</h3>
      ${cifreChiave()}
    </div>
    <div>
      <h3 class="jet-h5" style="margin:0 0 10px">Fonti</h3>
      <div class="voci" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
        ${Object.values(FONTI).map(([t,d,u])=>`<div class="voce" style="padding:14px 16px">
          <a class="jet-body-s" style="font-weight:600" href="${u}" target="_blank" rel="noopener">${esc(t)}</a>
          <div class="jet-body-xs jet-muted">${esc(d)}</div></div>`).join('')}
      </div>
    </div>
    <div>
      <h3 class="jet-h5" style="margin:0 0 8px">Come è verificato</h3>
      <p class="jet-body-s" style="margin:0 0 10px;color:var(--jet-text-regular);max-width:74ch">
      Due controlli, di natura diversa. <b>A ogni ricalcolo</b> la pagina verifica che la somma
      delle voci sia il netto annuo: il netto non è un totale calcolato a parte e poi confrontato,
      è quella somma. Una tabella che non chiude non può comparire a schermo.
      <b>Fuori dalla pagina</b> gira una matrice di prove sul motore, in tre categorie tenute
      distinte perché provano cose diverse: poche ancore confrontate a mano con la norma
      (la catena completa a 35.000 €, il massimale, la fine dell'esenzione comunale, la capienza
      delle detrazioni), le sette soglie e i quattro cambi di pendenza presi a un centesimo di
      distanza, e una rete di regressione a passo di 100 € da 0 a 200.000 €.</p>
      <p class="jet-body-s" style="margin:0;color:var(--jet-text-regular);max-width:74ch">
      Cosa <b>non</b> è provato conta quanto il resto: nessun consulente del lavoro ha validato
      questi numeri, e la riconciliazione da sola non prova la correttezza — conferma un'identità
      algebrica, e resterebbe verde anche con le aliquote sbagliate. L'elenco completo di ciò che
      è provato e di ciò che non lo è sta nel repository, in
      <span class="jet-chip jet-chip--mono">processo/verifica.md</span>.</p>
    </div>
    <div>
      <h3 class="jet-h5" style="margin:0 0 4px">Limiti dichiarati</h3>
      <p class="jet-body-s jet-muted" style="margin:0 0 10px">Quattro, in chiaro. Uno strumento onesto dichiara dove smette di valere.</p>
      <div class="jet-accordion">${LIMITI.map(([t,b])=>`<details><summary><span>${esc(t)}</span></summary>
        <div class="jet-body-s" style="padding-bottom:18px;color:var(--jet-text-regular);max-width:74ch">${esc(b)}</div>
      </details>`).join('')}</div>
    </div>
  </div>`;
}
function faq(){
  return `<div class="jet-accordion">${FAQ.map(([q,a])=>`<details><summary><span>${q}</span></summary>
    <div class="jet-body-s" style="padding-bottom:18px;color:var(--jet-text-regular);max-width:74ch">${a}</div>
  </details>`).join('')}</div>`;
}

/* ============================================================
   LE SEZIONI — stesso contenuto, tre organizzazioni diverse
   ============================================================ */
function sezioni(res,st){
  return [
    {id:'risultato',eye:'Livello 1 — la risposta',t:'Quanto ti resta',
     lede:'Il netto annuo maturato sulla RAL inserita, e la sua media per mensilità.',
     body:`${answerBlock(res)}<div style="margin-top:22px">${kpis(res)}</div>
       ${avvisoMassimale(res)}`},
    {id:'flusso',eye:'Livello 2 — il flusso',t:'Dove va il resto',
     lede:'Le fasce sono in scala: la larghezza di ogni flusso è proporzionale al suo importo. Si parte dalla RAL, non dal costo azienda: questo strumento risponde a «dove vanno i soldi trattenuti sul mio lordo», non a quanto costi all\'azienda. Clicca una fascia per aprirne le voci.',
     body:`${sankey(res,260,13)}<div class="legend" style="margin-top:14px">${legendItems(res)}</div>`},
    {id:'dettaglio',eye:'Livello 3 — il dettaglio',t:'Ogni euro, voce per voce',
     lede:'La catena completa, con gli operatori in chiaro. Ogni riga contrassegnata si apre: cliccala e la spiegazione compare qui a fianco.',
     body:chain(res,st)},
    {id:'metodo',eye:'Metodo',t:'Come è costruito il calcolo',
     lede:'Le regole sono dichiarate, non selezionabili: un solo caso, spiegato per intero.',
     body:metodo()},
    {id:'faq',eye:'Domande frequenti',t:'Le domande che arrivano sempre',
     lede:'',body:faq()},
  ];
}
const anchorsHTML=st=>`<nav class="anchors" aria-label="Sezioni del risultato">
  ${SEZIONI.map(([id,l])=>`<a href="#${id}" data-anchor="${id}"
     aria-current="${st.attiva===id}">${l}</a>`).join('')}</nav>`;

/* ---- la pagina del risultato: barra di ancore appiccicosa,
       sezioni a fasce alternate ---- */
function pagina(res,st){
  const secs=sezioni(res,st);
  return `<div class="pg">${hero()}${form(st)}</div>
    <div class="anchorbar" style="margin-top:32px"><div class="pg"><div class="inner">
      ${anchorsHTML(st)}
      <div class="mini"><span class="jet-body-xs jet-muted">NETTO ANNUO</span>
        <b>${eur(res.kpi.nettoAnnuo)}</b></div>
    </div></div></div>
    ${secs.map((s,i)=>`<section class="sec" id="${s.id}"
      style="background:${i%2?'var(--jet-surface-ivory)':'var(--jet-white)'};padding:56px 0;
      border-bottom:1px solid var(--jet-border)">
      <div class="pg">
        <div class="sec-eyebrow">${s.eye}</div>
        <div class="sec-head"><h2 style="margin-top:10px">${s.t}</h2>${s.tool||''}</div>
        ${s.lede?`<p class="lede">${s.lede}</p>`:''}
        <div class="sec-body">${s.body}</div>
      </div></section>`).join('')}
    <footer class="calc-footer">Prototipo di Riccardo Sartori per il task AI Builder @ Jet HR.</footer>
    ${eggDialog()}`;
}
const eggDialog=()=>`<dialog class="egg-modal" id="egg"><p>Questa non è più una RAL.<br>È un pre-seed!</p></dialog>`;
function vuoto(st){
  return `<div class="pg">${hero()}${form(st)}
    <section class="sec" style="margin-top:40px">
      <div class="sec-eyebrow">Prima di calcolare</div>
      <h2 style="margin-top:10px">Cifre chiave 2026</h2>
      <p class="lede">Le regole che il calcolo applica. Sono dichiarate, non selezionabili.</p>
      <div class="sec-body">${cifreChiave()}</div>
    </section>
    <section class="sec" style="margin-top:40px;padding-bottom:40px">
      <div class="sec-eyebrow">Domande frequenti</div>
      <h2 style="margin-top:10px">Le domande che arrivano sempre</h2>
      <div class="sec-body">${faq()}</div>
    </section>
    <footer class="calc-footer" style="margin-top:40px">Prototipo di Riccardo Sartori per il task AI Builder @ Jet HR.</footer>
  </div>${eggDialog()}`;
}

/* ============================================================
   STATO E EVENTI
   ============================================================ */
const st={ralRaw:'35.000',mensilita:13,
  aperta:null,attiva:'risultato',res:null,errore:null,dirty:false,eggPending:false};

function fromURL(){
  const p=new URLSearchParams(location.search);
  if(p.get('ral'))st.ralRaw=p.get('ral');
  if(p.get('m'))st.mensilita=p.get('m')==='12'?12:13;
  if(p.get('calc')==='1')commit(true);
}
function toURL(){
  const p=new URLSearchParams();
  p.set('ral',st.ralRaw);p.set('m',String(st.mensilita));
  if(st.res)p.set('calc','1');
  history.replaceState(null,'','?'+p.toString());
}
function commit(silenzioso){
  st.errore=null;
  const v=parseRal(st.ralRaw);
  if(v===null){st.errore='Inserisci la RAL per calcolare.';st.res=null;}
  else if(Number.isNaN(v)){st.errore='Solo cifre: usa la virgola per i decimali, per esempio 35.000,50.';st.res=null;}
  else if(Number(v)<0){st.errore='La RAL non può essere negativa.';st.res=null;}
  else if(Number(v)===4700000){st.res=null;st.dirty=false;st.eggPending=true;}
  else if(Number(v)>1000000){st.errore='Il calcolo è disponibile fino a una RAL di 1.000.000 €.';st.res=null;}
  else{st.res=calcola(v,st.mensilita);st.dirty=false;st.eggPending=false;
    if(!st.aperta)st.aperta='ivs';}   // mostra subito a cosa serve il pannello
  if(!silenzioso)render();
}
/* Prima di ridisegnare annoto CHI aveva il fuoco, in modo da restituirglielo
   dopo. Senza questo, chi usa la tastiera torna a inizio pagina ogni volta
   che apre una voce. */
function segnaFuoco(){
  const a=document.activeElement;
  if(!a||a===document.body)return null;
  const r=a.closest('[data-voce]');
  if(r)return `tr[data-voce="${r.dataset.voce}"] .lbl`;
  const b=a.closest('[data-band]');
  if(b)return `[data-band="${b.dataset.band}"]`;
  const m=a.closest('[data-m]');
  if(m)return `[data-m="${m.dataset.m}"]`;
  return a.id?'#'+a.id:null;
}
function rendiFuoco(sel){
  if(!sel)return;
  document.querySelector(sel)?.focus({preventScroll:true});
}
let obs=null;
function scrollspy(){
  if(obs)obs.disconnect();
  const secs=[...document.querySelectorAll('.sec[id]')];
  if(!secs.length)return;
  obs=new IntersectionObserver(es=>{
    const vis=es.filter(e=>e.isIntersecting)
      .sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
    if(!vis)return;
    const id=vis.target.id;
    if(id===st.attiva)return;
    st.attiva=id;
    document.querySelectorAll('[data-anchor]').forEach(a=>
      a.setAttribute('aria-current',String(a.dataset.anchor===id)));
  },{rootMargin:'-96px 0px -55% 0px',threshold:0});
  secs.forEach(s=>obs.observe(s));
}
function render(keepScroll){
  const y=window.scrollY,fuoco=segnaFuoco();
  document.getElementById('app').innerHTML=
    st.res?pagina(st.res,st):vuoto(st);
  if(st.dirty)document.querySelector('.calcrow')?.closest('.jet-card')?.classList.add('is-dirty');
  toURL();scrollspy();
  if(keepScroll)window.scrollTo(0,y);
  rendiFuoco(fuoco);
  const egg=document.getElementById('egg');
  if(egg&&st.eggPending){egg.showModal();st.eggPending=false;}
}
document.addEventListener('input',e=>{
  if(e.target.id!=='ral')return;
  st.ralRaw=e.target.value;
  if(st.res){st.dirty=true;e.target.closest('.jet-card')?.classList.add('is-dirty');}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='ral'&&e.key==='Enter'){e.preventDefault();commit();}
});
document.addEventListener('click',e=>{
  if(e.target.id==='egg'){e.target.close();return;}
  const a=e.target.closest('[data-anchor]');
  if(a){e.preventDefault();
    document.getElementById(a.dataset.anchor)?.scrollIntoView({
      behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
    return;}
  const t=e.target.closest('#go,#reset,[data-m],[data-voce],[data-band]');
  if(!t)return;
  if(t.id==='go')return commit();
  if(t.id==='reset'){st.res=null;st.ralRaw='';st.aperta=null;st.errore=null;return render();}
  if(t.hasAttribute('data-m')){
    st.mensilita=Number(t.dataset.m);
    // Mensilita' e' presentazione, non calcolo: si divide il netto annuo
    // gia' calcolato, senza richiamare il motore.
    if(st.res)st.res=applicaMensilita(st.res,st.mensilita);
    return render(true);}
  if(t.hasAttribute('data-voce')){
    st.aperta=st.aperta===t.dataset.voce?null:t.dataset.voce;return render(true);}
  if(t.hasAttribute('data-band')){
    // Il netto non e' una voce della catena: e' il totale. La sua fascia porta al
    // dettaglio senza svuotare il pannello, cosi' il clic non sembra fallito.
    const map={contributi:'ivs',imposte:'lorda',integrazioni:'somma'};
    const voce=map[t.dataset.band];
    if(voce)st.aperta=voce;
    render(true);
    document.getElementById('dettaglio')?.scrollIntoView({
      behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
    if(st.aperta)rendiFuoco(`tr[data-voce="${st.aperta}"] .lbl`);
  }
});
document.addEventListener('keydown',e=>{
  const b=e.target.closest('[data-band]');
  // Le fasce del flusso sono elementi SVG: non hanno il metodo click(),
  // quindi da tastiera l'evento va costruito a mano.
  if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();
    b.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
fromURL();render();

</script>
</body>
</html>
